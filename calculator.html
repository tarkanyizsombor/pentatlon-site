<style>
:root{--tint:#f5f8ff;--soft:#eef4ff;--bg:#ffffff;--card:#ffffff;--text:#0b1b3a;--muted:#5a6b85;--line:#dde5f0;--accent:#1d4ed8;--ink:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
.total{background:var(--accent);color:var(--ink);border-radius:16px;padding:20px;margin-bottom:16px}
.total small{display:block;opacity:.85;font-size:.85rem}
.total b{display:block;font-size:3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(29,78,216,.06)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.head h2{font-size:1rem;margin:0}
.pts{font-size:1.4rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:3px}
input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--tint);color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:.78rem;color:var(--muted);margin:8px 0 0}
.err{color:#c0392b}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:10px 8px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--ink)}
.hide{display:none}
.note{font-size:.8rem;color:var(--muted);margin-top:20px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav"></nav>
  <header class="phead"><div class="ph-in"><h1 data-i18n="c.title"></h1>
    <p class="sub" data-i18n="c.sub"></p></div></header>

  <div class="seg" id="mode" role="tablist" aria-label="Competition round">
    <button data-m="q" class="on" role="tab" data-i18n="c.q"></button>
    <button data-m="de" role="tab" data-i18n="c.de"></button>
  </div>

  <div class="total"><small data-i18n="c.total"></small><b id="total">0</b><small id="count"></small></div>

  <div class="grid">
    <section class="card">
      <div class="head"><h2 id="f-title"></h2><span class="pts" id="p-f">–</span></div>
      <div id="f-q">
        <div class="row">
          <div><label for="f-v" data-i18n="c.v"></label><input id="f-v" inputmode="numeric" placeholder="22"></div>
          <div><label for="f-d" data-i18n="c.d"></label><input id="f-d" inputmode="numeric" placeholder="13"></div>
          <div><label for="f-w" data-i18n="c.w"></label><input id="f-w" inputmode="numeric" placeholder="auto"></div>
          <div><label for="f-pen" data-i18n="c.pen"></label><input id="f-pen" inputmode="numeric" placeholder="0"></div>
        </div>
      </div>
      <div id="f-de" class="hide">
        <label for="f-p" data-i18n="c.dePlace"></label>
        <input id="f-p" inputmode="numeric" placeholder="5">
      </div>
      <p class="hint" id="h-f"></p>
    </section>

    <section class="card">
      <div class="head"><h2 data-i18n="d.o"></h2><span class="pts" id="p-o">–</span></div>
      <label for="o-t" data-i18n="c.oTime"></label>
      <input id="o-t" inputmode="decimal" placeholder="27,60">
    </section>

    <section class="card">
      <div class="head"><h2 data-i18n="c.swim"></h2><span class="pts" id="p-s">–</span></div>
      <label for="s-t" data-i18n="c.sTime"></label>
      <input id="s-t" inputmode="decimal" placeholder="1:01,50">
      <p class="hint" data-i18n="c.sHint"></p>
    </section>

    <section class="card">
      <div class="head"><h2 data-i18n="d.l"></h2><span class="pts" id="p-l">–</span></div>
      <label for="l-t" data-i18n="c.lTime"></label>
      <input id="l-t" inputmode="decimal" placeholder="11:45,00">
      <p class="hint" data-i18n="c.lHint"></p>
    </section>
  </div>

  <p class="note" data-i18n="c.note"></p>
</div>
<script>
const T = SITE.t;
const $ = id => document.getElementById(id);
const up = x => Math.max(0, Math.ceil(x - 1e-9));
// Accepts 1:05.64, 1:05,64, 1.05,64, 65,64 or 65.64. Phones that only offer a comma (and no colon) work too.
// minSec: if a single number is far too small to be a time in seconds (e.g. 11.45 for a laser run), read it as minutes.seconds.
function parseT(s, minSec){
  s = s.trim().replace(/\s+/g, '');
  if(!s) return null;
  let m, sec;
  if(s.includes(':')){
    const [a, b, ...rest] = s.split(':');
    if(rest.length || b === undefined) return NaN;
    m = a; sec = b.replace(',', '.');
  } else {
    const parts = s.split(/[.,]/);
    if(parts.length === 3){ m = parts[0]; sec = parts[1] + '.' + parts[2]; }
    else if(parts.length <= 2){
      const v = parseFloat(parts.join('.'));
      if(parts.length === 2 && minSec && v < minSec && parts[1].length === 2){ m = parts[0]; sec = parts[1]; }
      else { m = '0'; sec = parts.join('.'); }
    } else return NaN;
  }
  if(!/^\d*$/.test(m) || !/^\d+(\.\d+)?$/.test(sec)) return NaN;
  const t = (parseInt(m || '0', 10) * 60) + parseFloat(sec);
  return isFinite(t) && t >= 0 ? t : NaN;
}
function timed(id, out, fn, minSec){
  const t = parseT($(id).value, minSec);
  if(t === null){ $(out).textContent = '–'; return null; }
  if(isNaN(t)){ $(out).textContent = '?'; return null; }
  const p = fn(t); $(out).textContent = p; return p;
}
let mode = 'q';

// Ranking-round value of one victory, by number of bouts (fencers in the group minus 1).
// Taken from the 2026 results: 23-29 bouts = 7, 30-33 = 6, 35-37 = 5. Other sizes are estimates.
function victoryValue(bouts){
  const seen = bouts >= 23 && bouts <= 37 && bouts !== 34;
  const v = bouts <= 29 ? 7 : bouts <= 33 ? 6 : 5;
  return {v, seen};
}

function fencingQ(){
  const h = $('h-f'); h.classList.remove('err');
  const V = $('f-v').value.trim(), D = $('f-d').value.trim();
  if(V === '' || D === ''){
    $('p-f').textContent = '–'; $('f-w').placeholder = T('c.auto');
    h.textContent = T('c.hEnterVD');
    return null;
  }
  const v = parseInt(V, 10), d = parseInt(D, 10);
  if(isNaN(v) || isNaN(d) || v < 0 || d < 0 || v + d < 1 || v + d > 60){
    $('p-f').textContent = '?'; $('f-w').placeholder = T('c.auto');
    h.textContent = T('c.hBadVD');
    h.classList.add('err'); return null;
  }
  const bouts = v + d;
  const auto = victoryValue(bouts);
  $('f-w').placeholder = String(auto.v);
  const w = $('f-w').value.trim() !== '' ? parseFloat($('f-w').value.replace(',', '.')) : auto.v;
  const pen = Math.abs(parseFloat(($('f-pen').value || '0').replace(',', '.'))) || 0;
  const base = Math.floor((7*bouts + 5)/10);   // 70% of bouts, rounded half up
  const p = v === 0 ? 0 : Math.max(0, Math.round(250 + w*(v - base) - pen));
  $('p-f').textContent = p;
  h.textContent = T('c.hRule', {b:bouts, base, w})
    + (pen ? T('c.hPen', {p:pen}) : '')
    + (!auto.seen && $('f-w').value.trim() === '' ? T('c.hEst') : '');
  return p;
}

function fencingDE(){
  // Direct elimination: points by final place (UIPM Appendix 2B2, matches all 2026 semi-final and final results)
  const FT = [250,244,238,236,230,228,226,224,218,216,214,212,210,208,206,204,198,196];
  const pl = parseInt($('f-p').value,10);
  const h = $('h-f'); h.classList.remove('err');
  if($('f-p').value.trim() === ''){ $('p-f').textContent = '–'; h.textContent = T('c.hDE0'); return null; }
  if(!(pl >= 1 && pl <= 18)){ $('p-f').textContent = '?'; h.textContent = T('c.hDEbad'); h.classList.add('err'); return null; }
  $('p-f').textContent = FT[pl-1];
  h.textContent = T(pl === 1 ? 'c.de1' : pl === 2 ? 'c.de2' : pl <= 4 ? 'c.de4' : pl <= 8 ? 'c.de8' : pl <= 16 ? 'c.de16' : 'c.de32');
  return FT[pl-1];
}

function calc(){
  $('f-title').textContent = T(mode === 'q' ? 'c.fq' : 'c.fde');
  const res = [];
  res.push(mode === 'q' ? fencingQ() : fencingDE());
  res.push(timed('o-t','p-o', t => up(445 - 3*t)));
  res.push(timed('s-t','p-s', t => up(250 + 5*(70 - t)), 40));
  res.push(timed('l-t','p-l', t => up(1300 - t), 300));
  const got = res.filter(x => x !== null && x !== undefined);
  $('total').textContent = got.reduce((a,b) => a+b, 0);
  $('count').textContent = T('c.count', {n:got.length});
}
document.querySelectorAll('input').forEach(i => i.addEventListener('input', calc));
$('mode').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  mode = b.dataset.m;
  $('mode').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  $('f-q').classList.toggle('hide', mode !== 'q');
  $('f-de').classList.toggle('hide', mode === 'q');
  calc();
});
SITE.onLang(calc);
calc();
</script>
</body>
</html>
