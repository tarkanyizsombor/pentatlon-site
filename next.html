<style>
:root{--tint:#f5f8ff;--bg:#ffffff;--card:#ffffff;--text:#0b1b3a;--muted:#5a6b85;--line:#dde5f0;--accent:#1d4ed8;--ink:#ffffff;--soft:#eef4ff;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:0 0 14px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:28px 0 10px}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:30px 34px;color:#fff;background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 45%,#14287a 100%);box-shadow:0 20px 50px rgba(20,40,122,.22)}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1a46b8 0%,#12318f 45%,#081544 100%);box-shadow:none;border:1px solid #1e2a3d}
.hero .g1{position:absolute;left:-15%;top:-60%;width:65%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(147,197,253,.5),rgba(96,165,250,0) 65%);pointer-events:none}
.hero .g2{position:absolute;right:-18%;bottom:-75%;width:72%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.35),rgba(34,211,238,0) 62%);pointer-events:none}
.hero>*{position:relative}
.hero .lbl{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.hero h2{font-size:clamp(1.6rem,4.6vw,2.6rem);font-weight:900;letter-spacing:-.025em;margin:6px 0 4px;line-height:1.1}
.hero .meta{font-size:1rem;opacity:.92}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 20px;max-width:640px}
.count div{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.26);border-radius:18px;padding:14px 8px;text-align:center}
.count b{display:block;font-size:clamp(1.8rem,6vw,3rem);font-weight:900;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.count span{display:block;font-size:.78rem;font-weight:600;opacity:.85;margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
.now{display:inline-block;margin:22px 0 18px;font-size:1.3rem;font-weight:800;background:rgba(255,255,255,.18);border-radius:999px;padding:8px 18px}
.ics{font:inherit;font-weight:700;color:#1d4ed8;background:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.ics:focus-visible{outline:2px solid #fff;outline-offset:2px}
.list{display:grid;gap:8px}
.ev{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.ev .date{min-width:120px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.ev .name{flex:1;min-width:0}
.ev .name b{display:block}
.ev .name span{color:var(--muted);font-size:.85rem}
.ev .left{color:var(--muted);font-size:.85rem;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(29,78,216,.06)}
.card p{margin:0 0 6px}
.card p:last-child{margin:0}
.card a{color:var(--accent)}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  @keyframes drift1{50%{transform:translate(6%,8%) scale(1.08)}}
  @keyframes drift2{50%{transform:translate(-7%,-6%) scale(1.1)}}
  @keyframes pulse{50%{opacity:.45}}
  @keyframes tickin{from{transform:translateY(-35%);opacity:.2}}
  .hero .g1{animation:drift1 14s ease-in-out infinite}.hero .g2{animation:drift2 17s ease-in-out infinite}
  .now{animation:pulse 1.6s ease-in-out infinite}
  .count b.tk{animation:tickin .35s cubic-bezier(.2,.7,.2,1)}
  .count div{transition:transform .25s,background-color .25s}.count div:hover{transform:translateY(-3px);background:rgba(255,255,255,.2)}
}
@media (max-width:640px){.wrap{padding:12px 12px 40px}.hero{padding:22px 18px;border-radius:20px}.count{gap:8px}.count div{padding:10px 4px;border-radius:14px}.ev{flex-wrap:wrap;gap:4px 12px}.ev .date{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav"></nav>
  <h1 data-i18n="nx.title"></h1>
  <div class="hero" id="hero"></div>

  <h2 data-i18n="nx.coming"></h2>
  <div class="list" id="coming"></div>

  <h2 data-i18n="nx.tba"></h2>
  <div class="list" id="tba"></div>

  <h2 data-i18n="nx.updates"></h2>
  <div class="card" id="updates"></div>
</div>
<script>
const t = SITE.t, CAL = window.CALENDAR, DATA = window.DATA;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loc = () => SITE.lang === 'hu' ? 'hu-HU' : 'en-GB';
const L = (e, k) => SITE.lang === 'hu' && e[k + '_hu'] ? e[k + '_hu'] : e[k];
const day = s => new Date(s + 'T12:00');
const fmtDay = (s, opts) => day(s).toLocaleDateString(loc(), opts || {year:'numeric', month:'long', day:'numeric'});
const range = e => {
  const a = day(e.start), b = day(e.end);
  if (a.getMonth() === b.getMonth()) return SITE.lang === 'hu'
    ? a.getFullYear() + '. ' + a.toLocaleDateString('hu-HU', {month:'long'}) + ' ' + a.getDate() + '–' + b.getDate() + '.'
    : a.getDate() + '–' + b.getDate() + ' ' + a.toLocaleDateString('en-GB', {month:'long', year:'numeric'});
  return fmtDay(e.start, {month:'short', day:'numeric'}) + ' – ' + fmtDay(e.end);
};
const startMs = e => Date.parse(e.start + 'T00:00:00' + (e.utc || 'Z'));
const endMs = e => Date.parse(e.end + 'T23:59:59' + (e.utc || 'Z'));
const dated = () => CAL.events.filter(e => e.start).sort((a, b) => startMs(a) - startMs(b));

// .ics file so the event can be added to a phone or computer calendar
function ics(e){
  const d = s => s.replace(/-/g, '');
  const endPlus = new Date(day(e.end).getTime() + 86400000).toISOString().slice(0, 10);
  const body = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ottusaeredmenyek.com//EN','BEGIN:VEVENT',
    'UID:' + d(e.start) + '-' + e.city.replace(/\W/g, '') + '@ottusaeredmenyek.com', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
    'DTSTART;VALUE=DATE:' + d(e.start), 'DTEND;VALUE=DATE:' + d(endPlus), 'SUMMARY:UIPM Pentathlon ' + e.name, 'LOCATION:' + e.city + ', ' + SITE.nation(e.c),
    'URL:https://ottusaeredmenyek.com/next', 'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], {type:'text/calendar'})); a.download = e.name.replace(/\W+/g, '-').toLowerCase() + '.ics';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

let current = null, timer = null, introDone = false;
function pickCurrent(){ const now = Date.now(); return dated().find(e => endMs(e) >= now) || null; }

function tick(){
  const box = $('cd'); if (!box || !current) return;
  const ms = startMs(current) - Date.now();
  if (ms <= 0){
    if (Date.now() > endMs(current)) { render(); return; }
    box.outerHTML = '<div class="now" id="cd">● ' + t('nx.now') + '</div>'; return;
  }
  const s = Math.floor(ms / 1000);
  const parts = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
  if (box.dataset.intro) return;
  box.querySelectorAll('b').forEach((b, i) => { const v = i ? String(parts[i]).padStart(2, '0') : String(parts[i]);
    if (b.textContent !== v){ const first = b.textContent === '–'; b.textContent = v; if (!first){ b.classList.remove('tk'); void b.offsetWidth; b.classList.add('tk'); } } });
}

function render(){
  current = pickCurrent();
  const hero = $('hero');
  if (!current) hero.innerHTML = '<div class="g1"></div><div class="g2"></div><h2>' + t('nx.none') + '</h2>';
  else hero.innerHTML = '<div class="g1"></div><div class="g2"></div><div class="lbl">' + t('nx.next') + '</div><h2>' + esc(L(current, 'name')) + '</h2>'
    + '<div class="meta">' + esc(range(current)) + ' · ' + esc(L(current, 'city')) + ', ' + esc(SITE.nation(current.c)) + '</div>'
    + '<div class="count" id="cd" role="timer" aria-live="off">' + ['nx.d','nx.h','nx.m','nx.s'].map(k => '<div><b>–</b><span>' + t(k) + '</span></div>').join('') + '</div>'
    + '<button class="ics" id="icsBtn" type="button">📅 ' + t('nx.ics') + '</button>';
  if (current) $('icsBtn').addEventListener('click', () => ics(current));
  tick(); clearInterval(timer); timer = setInterval(tick, 1000);
  const cd = $('cd'), dB = cd && cd.querySelector('b');
  if (dB && !introDone && SITE.countUp && !SITE.calm()){ introDone = true; const v = +dB.textContent; cd.dataset.intro = '1'; SITE.countUp(dB, v, 1000); setTimeout(() => { delete cd.dataset.intro; }, 1050); }

  const now = Date.now();
  const rest = dated().filter(e => e !== current && endMs(e) >= now);
  const daysTo = e => Math.ceil((startMs(e) - now) / 86400000);
  $('coming').innerHTML = rest.length ? rest.map(e => { const n = daysTo(e);
    return '<div class="ev"><div class="date">' + esc(range(e)) + '</div><div class="name"><b>' + esc(L(e, 'name')) + '</b><span>' + esc(L(e, 'city')) + ', ' + esc(SITE.nation(e.c)) + '</span></div><div class="left">' + (n === 1 ? t('nx.tomorrow') : t('nx.inDays', {n})) + '</div></div>'; }).join('')
    : '<p class="muted">–</p>';
  const tba = CAL.events.filter(e => !e.start);
  $('tba').innerHTML = tba.map(e => '<div class="ev"><div class="date">2027</div><div class="name"><b>' + esc(L(e, 'name')) + '</b><span>' + esc(L(e, 'city')) + ', ' + esc(SITE.nation(e.c)) + '</span></div></div>').join('');
  const lastEv = DATA.events[DATA.events.length - 1];
  $('updates').innerHTML = '<p><b>' + t('nx.results', {d: fmtDay(DATA.updated)}) + '</b></p>'
    + '<p class="muted">' + t('nx.latest', {e: esc(SITE.lang === 'hu' && lastEv.name_hu ? lastEv.name_hu : lastEv.name)}) + '</p>'
    + '<p class="muted">' + t('nx.cal', {d: fmtDay(CAL.checked)}) + ' <a href="' + CAL.source + '" target="_blank" rel="noopener">' + t('nx.calSrc') + ' ↗</a></p>';
}
SITE.onLang(render);
render();
</script>
</body>
</html>
