<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Athlete Results 2026 · Modern Pentathlon</title>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<script src="common.js"></script>
<script src="data.js"></script>
<style>
:root{--tint:#f5f8ff;--bg:#ffffff;--card:#ffffff;--text:#0b1b3a;--muted:#5a6b85;--line:#dde5f0;--accent:#1d4ed8;--ink:#ffffff;--soft:#eef4ff;--b:#eb6834;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--ink)}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--tint);color:var(--text);min-width:0}
#q{flex:1 1 180px}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto;box-shadow:0 1px 3px rgba(29,78,216,.06)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:.75rem;text-transform:uppercase;vertical-align:bottom;letter-spacing:.04em;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
th.sorted{color:var(--accent)}
#list th:nth-child(2),#list td:nth-child(2){text-align:left}
tbody tr.ath{cursor:pointer}
tbody tr.ath:hover,tbody tr.ath.open{background:var(--soft)}
td.tot{font-weight:700}
.nat{color:var(--muted);font-size:.8rem;margin-left:6px}
.n{color:var(--muted);font-size:.8rem}
tr.grp td{background:var(--tint);color:var(--accent);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:14px 10px 6px}
tr.detail>td{padding:0 0 12px;text-align:left;background:var(--soft);white-space:normal}
.ev{margin:10px 12px 0}
.ev h3{font-size:.85rem;margin:8px 0 6px}
.ev table{background:var(--card);border-radius:10px}
.ev td,.ev th{font-size:.82rem;padding:6px 8px;cursor:default}
.ev td:first-child,.ev th:first-child{text-align:left}
.raw{display:block;color:var(--muted);font-size:.72rem}
.el{color:#c0392b;font-weight:600}
.mini,.cards{display:none}
.empty{padding:24px;text-align:center;color:var(--muted)}
.note{font-size:.8rem;color:var(--muted);margin-top:16px;line-height:1.5}

/* progress charts */
.prog{margin:12px 12px 4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.prog h3{font-size:.9rem;margin:0}
.prog .s{font-size:.75rem;color:var(--muted);margin:0 0 8px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.chart h4{font-size:.78rem;margin:0 0 2px;color:var(--text)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font-size:10px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{stroke:var(--card);stroke-width:2}
.chart .lab{font-size:10px;font-weight:700;fill:var(--text)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.muted{color:var(--muted);font-size:.85rem}

/* head-to-head */
.h2hpick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.h2hpick label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.h2hpick label i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.h2hpick input{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(29,78,216,.06)}
.card h3{font-size:.95rem;margin:0 0 10px}
.cmp td,.cmp th{cursor:default}
.cmp th:first-child,.cmp td:first-child{text-align:left;white-space:normal}
.cmp td.win{color:var(--accent);font-weight:700;background:var(--soft)}
.cmp td.win.b{color:#b8471b;background:#fdf0ea}
.cmp th.a{color:var(--accent)} .cmp th.b{color:#b8471b}

@media (max-width:640px){
  .wrap{padding:12px 12px 40px}
  #list th.c,#list td.c{display:none}
  th,td{padding:10px 8px}
  #list td:nth-child(2){white-space:normal}
  .mini{display:block;color:var(--muted);font-size:.75rem;margin-top:2px}
  .ev .tbl{display:none}
  .cards{display:block}
  .rc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
  .rc .hd{display:flex;justify-content:space-between;font-weight:600;font-size:.85rem;margin-bottom:6px}
  .rc .g{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.82rem}
  .rc .g span.k{color:var(--muted);font-size:.72rem;display:block}
  .h2hpick{grid-template-columns:1fr}
  .cmp td,.cmp th{padding:8px 6px;font-size:.85rem}
}
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav"></nav>
  <h1 data-i18n="ath.title"></h1>
  <p class="sub" id="sub"></p>

  <div class="tabs" id="view">
    <button data-v="results" class="on" data-i18n="tab.results"></button>
    <button data-v="sf" data-i18n="tab.sf"></button>
    <button data-v="q" data-i18n="tab.q"></button>
    <button data-v="all" data-i18n="tab.all"></button>
    <button data-v="h2h" data-i18n="tab.h2h"></button>
  </div>

  <div class="controls">
    <div class="seg" id="gender"><button data-g="W" class="on" data-i18n="g.W"></button><button data-g="M" data-i18n="g.M"></button></div>
    <select id="event" aria-label="Competition"></select>
    <select id="nation" aria-label="Nation"></select>
    <input id="q" type="search" data-i18n-ph="search" aria-label="Search">
  </div>
  <p class="hint" id="hint"></p>

  <div id="listWrap" class="tbl">
    <table id="list">
      <thead id="head"></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <div id="h2h" hidden>
    <div class="h2hpick">
      <div><label for="ha"><i style="background:var(--accent)"></i><span data-i18n="h2h.a"></span></label><input id="ha" list="names" data-i18n-ph="h2h.ph" autocomplete="off"></div>
      <div><label for="hb"><i style="background:var(--b)"></i><span data-i18n="h2h.b"></span></label><input id="hb" list="names" data-i18n-ph="h2h.ph" autocomplete="off"></div>
    </div>
    <datalist id="names"></datalist>
    <div id="h2hOut"></div>
  </div>

  <p class="note" data-i18n="ath.note"></p>
</div>
<script>
const DATA = window.DATA, t = SITE.t;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RORD = {Q:0, SF:1, F:2};
const DISC = ['f','o','s','l'];
const evById = Object.fromEntries(DATA.events.map(e => [e.id, e]));
const evName = e => SITE.lang === 'hu' && e.name_hu ? e.name_hu : e.name;
const evShort = e => SITE.lang === 'hu' && e.short_hu ? e.short_hu : e.short;
const byAth = {}; for (const r of DATA.results) (byAth[r.a] ||= []).push(r);
const stByAth = {}; for (const s of DATA.standings) (stByAth[s.a] ||= []).push(s);

let state = {view:'results', g:'W', ev:DATA.events[DATA.events.length-1].id, nat:'', q:'', sort:'i', dir:1, open:null, ha:'', hb:''};

const avg = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : null;
const fmt = v => v === null || v === undefined ? '–' : (Number.isInteger(v) ? String(v) : v.toFixed(1));
const matches = a => (!state.nat || a.c === state.nat) && (!state.q || (a.n + ' ' + a.c + ' ' + (a.alt || []).join(' ')).toLowerCase().includes(state.q));
const roundName = r => t('r.' + r.r) + (r.grp ? ' ' + esc(r.grp) : '');

function cell(x, d){
  if (x.p === undefined) return '<span class="el">' + esc(x.st) + '</span>';
  let raw;
  if (d === 'f') raw = x.de ? t('raw.de', {n:x.rk}) : (x.v !== undefined ? t('raw.vd', {v:x.v, d:x.d}) : '');
  else raw = esc(x.t.replace(/^00:/, '')) + ' (' + x.rk + ')';
  return x.p + '<span class="raw">' + raw + '</span>';
}

/* ---------- progress charts (small multiples, one per discipline) ---------- */
// per competition: average points in that discipline over the athlete's rounds there
function perComp(id, d){
  const out = {};
  for (const ev of DATA.events){
    const v = avg((byAth[id] || []).filter(r => r.e === ev.id && r[d].p !== undefined).map(r => r[d].p));
    if (v !== null) out[ev.id] = v;
  }
  return out;
}
function chart(title, series, evIds){
  const W = 300, H = 140, L = 34, R = 34, T = 14, B = 26;
  const vals = series.flatMap(s => evIds.map(e => s.v[e]).filter(v => v !== undefined));
  if (!vals.length) return '';
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max(4, (hi - lo) * 0.15); lo = Math.floor((lo - pad) / 5) * 5; hi = Math.ceil((hi + pad) / 5) * 5;
  const x = i => evIds.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (evIds.length - 1);
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  let g = '';
  for (const v of [lo, (lo + hi) / 2, hi]){ g += '<line class="gl" x1="' + L + '" x2="' + (W - R + 6) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + Math.round(v) + '</text>'; }
  evIds.forEach((e, i) => { const lbl = evShort(evById[e]).replace(/^(WC|VK|EB|VB|Euros|Worlds) /, ''); g += '<text class="ax" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(lbl) + '</text>'; });
  for (const s of series){
    let path = '', open = false;
    evIds.forEach((e, i) => { const v = s.v[e]; if (v === undefined){ open = false; return; } path += (open ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); open = true; });
    g += '<path class="ln" d="' + path + '" stroke="' + s.color + '"/>';
    let last = -1;
    evIds.forEach((e, i) => {
      const v = s.v[e]; if (v === undefined) return; last = i;
      const tip = esc(s.name + ' · ' + evName(evById[e]) + ': ' + v.toFixed(1));
      g += '<g><title>' + tip + '</title><circle cx="' + x(i) + '" cy="' + y(v) + '" r="12" fill="transparent"/><circle class="pt" cx="' + x(i) + '" cy="' + y(v) + '" r="4.5" fill="' + s.color + '"/></g>';
    });
    if (last >= 0 && series.length === 1){
      const v = s.v[evIds[last]];
      g += '<text class="lab" x="' + (x(last) + 8) + '" y="' + (y(v) + 3) + '">' + fmt(+v.toFixed(1)) + '</text>';
    }
  }
  return '<div class="chart"><h4>' + esc(title) + '</h4><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(title) + '">' + g + '</svg></div>';
}
function progress(ids){
  const people = ids.map((id, i) => ({id, name:DATA.athletes[id].n, color: i === 0 ? '#1d4ed8' : '#eb6834'}));
  const evIds = DATA.events.map(e => e.id).filter(e => ids.some(id => (byAth[id] || []).some(r => r.e === e)));
  let h = '<div class="prog"><h3>' + t('prog.title') + '</h3><p class="s">' + t('prog.sub') + '</p>';
  if (evIds.length < 2) return h + '<p class="muted">' + t('prog.need2') + '</p></div>';
  if (people.length > 1) h += '<div class="legend">' + people.map(p => '<span><i style="background:' + p.color + '"></i>' + esc(p.name) + '</span>').join('') + '</div>';
  h += '<div class="charts">' + ['o','s','l'].map(d => chart(t('d.' + d), people.map(p => ({name:p.name, color:p.color, v:perComp(p.id, d)})), evIds)).join('') + '</div></div>';
  return h;
}

function detail(id){
  const rs = byAth[id] || [];
  const groups = {}; for (const r of rs) (groups[r.e] ||= []).push(r);
  let h = progress([id]);
  for (const ev of DATA.events){
    const g = groups[ev.id]; if (!g) continue;
    g.sort((a,b) => RORD[a.r] - RORD[b.r]);
    const st = (stByAth[id] || []).find(s => s.e === ev.id);
    h += '<div class="ev"><h3>' + esc(evName(ev)) + (st ? ' · ' + t('finalRank', {n:st.rank}) : '') + '</h3><div class="tbl"><table><thead><tr><th>' + t('round') + '</th><th>' + t('place') + '</th>' + DISC.map(d => '<th>' + t('d.' + d) + '</th>').join('') + '<th>' + t('total') + '</th></tr></thead><tbody>';
    for (const r of g) h += '<tr><td>' + roundName(r) + '</td><td>' + (r.rank ?? '–') + '</td>' + DISC.map(d => '<td>' + cell(r[d], d) + '</td>').join('') + '<td class="tot">' + r.tot + '</td></tr>';
    h += '</tbody></table></div><div class="cards">';
    for (const r of g) h += '<div class="rc"><div class="hd"><span>' + roundName(r) + ' · ' + t('placeShort', {n:r.rank ?? '–'}) + '</span><span>' + t('pts', {n:r.tot}) + '</span></div><div class="g">' + DISC.map(d => '<div><span class="k">' + t('d.' + d) + '</span>' + cell(r[d], d) + '</div>').join('') + '</div></div>';
    h += '</div></div>';
  }
  return h;
}

/* ---------- list views ---------- */
function viewResults(){
  const groups = {F:[], SF:[], Q:[]};
  for (const s of DATA.standings){
    if (s.e !== state.ev) continue;
    const a = DATA.athletes[s.a];
    if (!a || a.g !== state.g || !matches(a)) continue;
    const r = (byAth[s.a] || []).find(x => x.e === s.e && x.r === s.lvl);
    const row = {id:s.a, name:a.n, nat:a.c, i:s.rank, t:r ? r.tot : null};
    for (const d of DISC) row[d] = r && r[d].p !== undefined ? r[d].p : (r ? r[d].st : null);
    groups[s.lvl].push(row);
  }
  return {cols:DISC.map(k => ({k})), rankLabel:t('rank'), groups:[{title:t('grp.F'), rows:groups.F},{title:t('grp.SF'), rows:groups.SF},{title:t('grp.Q'), rows:groups.Q}]};
}
function seasonLevel(id){
  const sts = stByAth[id] || [];
  return {finals:sts.filter(s => s.lvl === 'F').length, semis:sts.filter(s => s.lvl === 'SF').length, best:sts.reduce((b,s) => RORD[s.lvl] > RORD[b] ? s.lvl : b, 'Q')};
}
function seasonRow(id, phase){
  const a = DATA.athletes[id];
  const keep = phase === 'q' ? (r => r.r === 'Q') : phase === 'sf' ? (r => r.r !== 'Q') : (r => true);
  const disc = phase === 'all' ? ['o','s','l'] : DISC;
  const rs = (byAth[id] || []).filter(keep);
  if (!rs.length) return null;
  const lv = seasonLevel(id);
  const row = {id, name:a.n, nat:a.c, n:rs.length, finals:lv.finals, semis:lv.semis, best:lv.best};
  for (const d of disc) row[d] = avg(rs.filter(r => r[d].p !== undefined).map(r => r[d].p));
  const full = rs.filter(r => disc.every(d => r[d].p !== undefined));
  row.t = avg(full.map(r => phase === 'all' ? disc.reduce((x,d) => x + r[d].p, 0) : r.tot));
  return row;
}
function viewAverages(phase){
  const all = [];
  for (const [id, a] of Object.entries(DATA.athletes)){
    if (a.g !== state.g || !matches(a)) continue;
    const row = seasonRow(id, phase); if (row) all.push(row);
  }
  if (phase === 'all') all.sort((a,b) => (b.t ?? -1) - (a.t ?? -1));
  else all.sort((a,b) => b.finals - a.finals || b.semis - a.semis || (b.t ?? -1) - (a.t ?? -1));
  all.forEach((r,i) => r.i = i+1);
  const by = lvl => all.filter(r => r.best === lvl);
  const groups = phase === 'all' ? [{title:t('grp.all'), rows:all}]
    : phase === 'q' ? [{title:t('grp.reachedF'), rows:by('F')},{title:t('grp.reachedSF'), rows:by('SF')},{title:t('grp.qOnly'), rows:by('Q')}]
    : [{title:t('grp.reachedF'), rows:by('F')},{title:t('grp.sfOnly'), rows:by('SF')}];
  const disc = phase === 'all' ? ['o','s','l'] : DISC;
  return {cols:[{k:'n', cls:'n'}, ...disc.map(k => ({k}))], rankLabel:'#', totalLabel: phase === 'all' ? t('combined') : t('total'), groups};
}
const colLabel = k => k === 'n' ? t('rounds') : t('d.' + k);

function renderList(){
  const v = state.view === 'results' ? viewResults() : viewAverages(state.view);
  const cols = [{k:'i', label:v.rankLabel}, {k:'name', label:t('athlete')}, ...v.cols.map(c => ({...c, label:colLabel(c.k), cls:'c ' + (c.cls || '')})), {k:'t', label:v.totalLabel || t('total')}];
  $('head').innerHTML = '<tr>' + cols.map(c => '<th data-k="' + c.k + '" class="' + (c.cls || '') + (state.sort === c.k ? ' sorted' : '') + '">' + esc(c.label) + '</th>').join('') + '</tr>';
  const ncol = cols.length, k = state.sort, dir = state.dir;
  const cmp = (a,b) => {
    const x = a[k], y = b[k];
    if (typeof x === 'string' && typeof y === 'string') return dir * x.localeCompare(y);
    return dir * ((typeof x === 'number' ? x : -Infinity) - (typeof y === 'number' ? y : -Infinity));
  };
  const fv = (x, key) => (state.view !== 'results' && key !== 'n' && typeof x === 'number') ? x.toFixed(1) : fmt(x);
  let h = '';
  for (const g of v.groups){
    if (!g.rows.length) continue;
    g.rows.sort(cmp);
    h += '<tr class="grp"><td colspan="' + ncol + '">' + esc(g.title) + ' · ' + g.rows.length + '</td></tr>';
    for (const r of g.rows){
      const mini = v.cols.filter(c => c.k !== 'n').map(c => colLabel(c.k) + ' ' + (typeof r[c.k] === 'string' ? r[c.k] : fv(r[c.k], c.k))).join(' · ');
      h += '<tr class="ath' + (state.open === r.id ? ' open' : '') + '" data-id="' + esc(r.id) + '"><td>' + r.i + '</td><td>' + esc(r.name) + '<span class="nat">' + esc(r.nat) + '</span><span class="mini">' + esc(mini) + '</span></td>'
        + v.cols.map(c => '<td class="c ' + (c.cls || '') + '">' + (typeof r[c.k] === 'string' ? '<span class="el">' + esc(r[c.k]) + '</span>' : fv(r[c.k], c.k)) + '</td>').join('')
        + '<td class="tot">' + fv(r.t, 't') + '</td></tr>';
      if (state.open === r.id) h += '<tr class="detail"><td colspan="' + ncol + '">' + detail(r.id) + '</td></tr>';
    }
  }
  $('body').innerHTML = h || '<tr><td colspan="' + ncol + '" class="empty">' + t('noAthletes') + '</td></tr>';
}

/* ---------- head-to-head ---------- */
const nameToId = () => { const m = {}; for (const [id, a] of Object.entries(DATA.athletes)) if (a.g === state.g) m[a.n.toLowerCase()] = id; return m; };
function renderH2H(){
  const opts = Object.values(DATA.athletes).filter(a => a.g === state.g && (!state.nat || a.c === state.nat)).sort((a,b) => a.n.localeCompare(b.n));
  $('names').innerHTML = opts.map(a => '<option value="' + esc(a.n) + '">' + esc(a.c) + '</option>').join('');
  const m = nameToId();
  const ia = m[$('ha').value.trim().toLowerCase()], ib = m[$('hb').value.trim().toLowerCase()];
  const out = $('h2hOut');
  if (!ia || !ib){
    const typed = $('ha').value.trim() && $('hb').value.trim();
    out.innerHTML = '<p class="muted">' + t(typed ? 'h2h.notFound' : 'h2h.pick') + '</p>'; return;
  }
  const A = DATA.athletes[ia], B = DATA.athletes[ib];
  const sq = id => seasonRow(id, 'q'), ss = id => seasonRow(id, 'sf'), sa = id => seasonRow(id, 'all');
  const lv = id => seasonLevel(id);
  const comps = id => new Set((byAth[id] || []).map(r => r.e)).size;
  const bestRank = id => { const r = (stByAth[id] || []).map(s => s.rank); return r.length ? Math.min(...r) : null; };
  const rows = [
    ['h2h.comps', comps(ia), comps(ib), 0],
    ['h2h.finals', lv(ia).finals, lv(ib).finals, 1],
    ['h2h.bestRank', bestRank(ia), bestRank(ib), -1],
    ['d.o', sa(ia)?.o ?? null, sa(ib)?.o ?? null, 1],
    ['d.s', sa(ia)?.s ?? null, sa(ib)?.s ?? null, 1],
    ['d.l', sa(ia)?.l ?? null, sa(ib)?.l ?? null, 1],
    ['h2h.fq', sq(ia)?.f ?? null, sq(ib)?.f ?? null, 1],
    ['h2h.fd', ss(ia)?.f ?? null, ss(ib)?.f ?? null, 1],
    ['h2h.tq', sq(ia)?.t ?? null, sq(ib)?.t ?? null, 1],
    ['h2h.tsf', ss(ia)?.t ?? null, ss(ib)?.t ?? null, 1]
  ];
  const f1 = (v, int) => v === null ? '–' : (int ? String(v) : v.toFixed(1));
  let h = '<div class="card"><h3>' + t('h2h.season') + '</h3><div class="tbl"><table class="cmp"><thead><tr><th></th><th class="a">' + esc(A.n) + '<span class="raw">' + esc(A.c) + '</span></th><th class="b">' + esc(B.n) + '<span class="raw">' + esc(B.c) + '</span></th></tr></thead><tbody>';
  rows.forEach(([key, a, b, better], i) => {
    const int = i < 3;
    const wa = better && a !== null && b !== null && (better > 0 ? a > b : a < b);
    const wb = better && a !== null && b !== null && (better > 0 ? b > a : b < a);
    h += '<tr><td>' + t(key) + '</td><td class="' + (wa ? 'win' : '') + '">' + f1(a, int) + '</td><td class="' + (wb ? 'win b' : '') + '">' + f1(b, int) + '</td></tr>';
  });
  h += '</tbody></table></div><p class="note" style="margin-top:8px">' + t('h2h.avgNote') + '</p></div>';
  h += '<div class="card" style="padding:0;overflow:hidden">' + progress([ia, ib]).replace('class="prog"', 'class="prog" style="margin:0;border:0;box-shadow:none"') + '</div>';
  const shared = DATA.events.filter(e => (stByAth[ia] || []).some(s => s.e === e.id) && (stByAth[ib] || []).some(s => s.e === e.id));
  h += '<div class="card"><h3>' + t('h2h.shared') + '</h3>';
  if (!shared.length) h += '<p class="muted">' + t('h2h.noShared') + '</p>';
  else {
    h += '<div class="tbl"><table class="cmp"><thead><tr><th>' + t('b.comp') + '</th><th class="a">' + esc(A.n) + '</th><th class="b">' + esc(B.n) + '</th></tr></thead><tbody>';
    for (const e of shared){
      const sa_ = stByAth[ia].find(s => s.e === e.id), sb_ = stByAth[ib].find(s => s.e === e.id);
      const ra = byAth[ia].find(r => r.e === e.id && r.r === sa_.lvl), rb = byAth[ib].find(r => r.e === e.id && r.r === sb_.lvl);
      const cellOf = (s, r) => s.rank + '.<span class="raw">' + t('r.' + s.lvl) + (r ? ' · ' + t('pts', {n:r.tot}) : '') + '</span>';
      h += '<tr><td>' + esc(evName(e)) + '</td><td class="' + (sa_.rank < sb_.rank ? 'win' : '') + '">' + cellOf(sa_, ra) + '</td><td class="' + (sb_.rank < sa_.rank ? 'win b' : '') + '">' + cellOf(sb_, rb) + '</td></tr>';
    }
    h += '</tbody></table></div>';
  }
  out.innerHTML = h + '</div>';
}

/* ---------- page ---------- */
const HINT = {results:'hint.results', sf:'hint.sf', q:'hint.q', all:'hint.all', h2h:'hint.h2h'};
function fillSelects(){
  $('event').innerHTML = DATA.events.map(e => '<option value="' + esc(e.id) + '">' + esc(evName(e)) + '</option>').join('');
  $('event').value = state.ev;
  const nats = [...new Set(Object.values(DATA.athletes).filter(a => a.g === state.g).map(a => a.c))].sort();
  if (state.nat && !nats.includes(state.nat)) state.nat = '';
  $('nation').innerHTML = '<option value="">' + t('allNations') + '</option>' + nats.map(c => '<option>' + esc(c) + '</option>').join('');
  $('nation').value = state.nat;
}
function render(){
  const n = DATA.events.length;
  $('sub').textContent = (n === 1 ? t('competition1') : t('competitions', {n})) + ': ' + DATA.events.map(evShort).join(', ');
  const h2h = state.view === 'h2h';
  $('event').style.display = state.view === 'results' ? '' : 'none';
  $('q').style.display = h2h ? 'none' : '';
  $('listWrap').hidden = h2h; $('h2h').hidden = !h2h;
  $('hint').textContent = t(HINT[state.view]);
  if (h2h) renderH2H(); else renderList();
}

fillSelects();
$('view').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.view = b.dataset.v; state.open = null; state.sort = 'i'; state.dir = 1;
  $('view').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
$('gender').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.g = b.dataset.g; state.open = null; $('ha').value = ''; $('hb').value = '';
  $('gender').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  fillSelects(); render();
});
$('event').addEventListener('change', e => { state.ev = e.target.value; state.open = null; render(); });
$('nation').addEventListener('change', e => { state.nat = e.target.value; state.open = null; render(); });
$('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
['ha','hb'].forEach(id => $(id).addEventListener('input', () => { if (state.view === 'h2h') renderH2H(); }));
$('head').addEventListener('click', e => {
  const th = e.target.closest('th'); if (!th) return;
  const k = th.dataset.k;
  if (state.sort === k) state.dir = -state.dir; else { state.sort = k; state.dir = (k === 'name' || k === 'i') ? 1 : -1; }
  render();
});
$('body').addEventListener('click', e => {
  const tr = e.target.closest('tr.ath'); if (!tr) return;
  state.open = state.open === tr.dataset.id ? null : tr.dataset.id;
  render();
});
SITE.onLang(() => { fillSelects(); render(); });
render();
</script>
</body>
