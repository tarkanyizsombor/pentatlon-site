<style>
:root{--tint:#f5f8ff;--bg:#ffffff;--card:#ffffff;--text:#0b1b3a;--muted:#5a6b85;--line:#dde5f0;--accent:#1d4ed8;--ink:#ffffff;--soft:#eef4ff;--b:#eb6834;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--ink)}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--tint);color:var(--text);min-width:0}
#q{flex:1 1 180px}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto;box-shadow:0 1px 3px rgba(29,78,216,.06)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:.75rem;text-transform:uppercase;vertical-align:bottom;letter-spacing:.04em;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
th.sorted{color:var(--accent)}
#list th:nth-child(2),#list td:nth-child(2){text-align:left}
tbody tr.ath{cursor:pointer}
tbody tr.ath:hover,tbody tr.ath.open{background:var(--soft)}
td.tot{font-weight:700}
.nat{color:var(--muted);font-size:.8rem;margin-left:6px}
.n{color:var(--muted);font-size:.8rem}
tr.grp td{background:var(--tint);color:var(--accent);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:14px 10px 6px}
tr.detail>td{padding:0 0 12px;text-align:left;background:var(--soft);white-space:normal}
.ev{margin:10px 12px 0}
.ev h3{font-size:.85rem;margin:8px 0 6px}
.ev table{background:var(--card);border-radius:10px}
.ev td,.ev th{font-size:.82rem;padding:6px 8px;cursor:default}
.ev td:first-child,.ev th:first-child{text-align:left}
.raw{display:block;color:var(--muted);font-size:.72rem}
.el{color:#c0392b;font-weight:600}
.mini,.cards{display:none}
.empty{padding:24px;text-align:center;color:var(--muted)}
.note{font-size:.8rem;color:var(--muted);margin-top:16px;line-height:1.5}

/* progress charts */
.prog{margin:12px 12px 4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.prog h3{font-size:.9rem;margin:0}
.prog .s{font-size:.75rem;color:var(--muted);margin:0 0 8px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.chart h4{font-size:.78rem;margin:0 0 2px;color:var(--text)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font-size:10px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{stroke:var(--card);stroke-width:2}
.chart .lab{font-size:10px;font-weight:700;fill:var(--text)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.muted{color:var(--muted);font-size:.85rem}
.members{display:block;font-size:.8rem;color:var(--muted);margin-top:2px;white-space:normal}
.members a{color:var(--accent);text-decoration:none}
.members a:hover{text-decoration:underline}
.shareRow{display:flex;justify-content:flex-end;margin:10px 12px 0}
.sharebtn{font:inherit;font-size:.8rem;font-weight:600;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.sharebtn:hover{border-color:var(--accent)}
.sharebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* head-to-head */
.h2hpick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.h2hpick label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.h2hpick label i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.h2hpick input{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(29,78,216,.06)}
.card h3{font-size:.95rem;margin:0 0 10px}
.cmp td,.cmp th{cursor:default}
.cmp th:first-child,.cmp td:first-child{text-align:left;white-space:normal}
.cmp td.win{color:var(--accent);font-weight:700;background:var(--soft)}
.cmp td.win.b{color:#b8471b;background:#fdf0ea}
.cmp th.a{color:var(--accent)} .cmp th.b{color:#b8471b}

/* following filter */
.folchip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600;font-size:.9rem;padding:8px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.folchip b{color:#f59e0b;font-size:1rem;line-height:1}
.folchip .cnt{font-size:.75rem;font-weight:700;background:var(--soft);color:var(--accent);border-radius:999px;padding:1px 7px}
.folchip[aria-pressed="true"]{border-color:#f59e0b;background:rgba(245,158,11,.1);color:var(--text)}
.folchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.followbtn{font:inherit;font-size:.8rem;font-weight:700;border-radius:999px;padding:6px 12px;cursor:pointer;border:1px solid #f59e0b;background:var(--card);color:#b45309;margin-right:8px}
.followbtn.on{background:#f59e0b;color:#fff}
:root[data-theme="dark"] .followbtn{color:#fbbf24}:root[data-theme="dark"] .followbtn.on{color:#1a1206;background:#fbbf24;border-color:#fbbf24}
.followbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* strength profile */
.sp{margin:12px 12px 4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sp h3{font-size:.95rem;margin:0}
.sp .s{font-size:.76rem;color:var(--muted);margin:2px 0 12px;line-height:1.45}
.sp .row{display:grid;grid-template-columns:110px 1fr 128px;gap:12px;align-items:center;padding:7px 0}
.sp .row+.row{border-top:1px dashed var(--line)}
.sp .lbl b{display:block;font-size:.88rem}
.sp .lbl small{color:var(--muted);font-size:.74rem}
.sp .track{position:relative;height:12px;border-radius:999px;background:var(--soft);overflow:visible}
.sp .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#93c5fd,#1d4ed8)}
:root[data-theme="dark"] .sp .fill{background:linear-gradient(90deg,#2b5c9e,#7cc8ff)}
.sp .mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--muted);opacity:.45}
.sp .val{text-align:right;line-height:1.25}
.sp .val b{display:block;font-size:.9rem;color:var(--accent)}
.sp .val small{color:var(--muted);font-size:.74rem}
.sp .row.na .val b{color:var(--muted)}
.sp .sum{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sp .sum span{font-size:.8rem;border-radius:999px;padding:5px 11px;background:var(--soft);color:var(--text)}
.sp .sum span b{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){@keyframes grow{from{transform:scaleX(0)}}.sp .fill{transform-origin:0 50%;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}.sp .row:nth-child(4) .fill{animation-delay:.06s}.sp .row:nth-child(5) .fill{animation-delay:.12s}.sp .row:nth-child(6) .fill{animation-delay:.18s}}

/* relay cells: time first, points under it */
.rt{font-weight:700;color:var(--text)}
.rgrid{display:none}
@media (max-width:640px){.sp .row{grid-template-columns:84px 1fr 96px;gap:8px}.sp{margin:10px 8px 4px;padding:12px}
  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  .rgrid div{background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:6px 8px;white-space:normal}
  .rgrid .k{display:block;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .rgrid .rt{font-size:.9rem}
  .rgrid .raw{display:block}}

@media (max-width:640px){
  .wrap{padding:12px 12px 40px}
  #list th.c,#list td.c{display:none}
  th,td{padding:10px 8px}
  #list td:nth-child(2){white-space:normal}
  .mini{display:block;color:var(--muted);font-size:.75rem;margin-top:2px}
  .ev .tbl{display:none}
  .cards{display:block}
  .rc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
  .rc .hd{display:flex;justify-content:space-between;font-weight:600;font-size:.85rem;margin-bottom:6px}
  .rc .g{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.82rem}
  .rc .g span.k{color:var(--muted);font-size:.72rem;display:block}
  .h2hpick{grid-template-columns:1fr}
  .cmp td,.cmp th{padding:8px 6px;font-size:.85rem}
}
</style>

<body>
<div class="wrap">
  <nav id="nav"></nav>
  <header class="phead"><div class="ph-in"><h1 data-i18n="ath.title"></h1>
    <p class="sub" id="sub"></p></div></header>

  <div class="tabs" id="view">
    <button data-v="results" class="on" data-i18n="tab.results"></button>
    <button data-v="sf" data-i18n="tab.sf"></button>
    <button data-v="q" data-i18n="tab.q"></button>
    <button data-v="all" data-i18n="tab.all"></button>
    <button data-v="h2h" data-i18n="tab.h2h"></button>
    <button data-v="relay" data-i18n="tab.relay"></button>
  </div>

  <div class="controls">
    <div class="seg" id="gender"><button data-g="W" class="on" data-i18n="g.W"></button><button data-g="M" data-i18n="g.M"></button><button data-g="X" data-i18n="g.X" hidden></button></div>
    <select id="event" aria-label="Competition"></select>
    <select id="nation" aria-label="Nation"></select>
    <input id="q" type="search" data-i18n-ph="search" aria-label="Search">
    <button type="button" class="folchip" id="folBtn" aria-pressed="false"><b>★</b><span data-i18n="fol.filter"></span><span class="cnt" id="folN">0</span></button>
  </div>
  <p class="hint" id="hint"></p>

  <div id="listWrap" class="tbl">
    <table id="list">
      <thead id="head"></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <div id="h2h" hidden>
    <div class="h2hpick">
      <div><label for="ha"><i style="background:var(--s1)"></i><span data-i18n="h2h.a"></span></label><input id="ha" list="names" data-i18n-ph="h2h.ph" autocomplete="off"></div>
      <div><label for="hb"><i style="background:var(--s2)"></i><span data-i18n="h2h.b"></span></label><input id="hb" list="names" data-i18n-ph="h2h.ph" autocomplete="off"></div>
    </div>
    <datalist id="names"></datalist>
    <div id="h2hOut"></div>
  </div>

  <p class="note" data-i18n="ath.note"></p>
</div>
<script>
const DATA = window.DATA, t = SITE.t;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RORD = {Q:0, SF:1, F:2};
const DISC = ['f','o','s','l'];
const evById = Object.fromEntries(DATA.events.map(e => [e.id, e]));
const evName = e => SITE.lang === 'hu' && e.name_hu ? e.name_hu : e.name;
const evShort = e => SITE.lang === 'hu' && e.short_hu ? e.short_hu : e.short;
const byAth = {}; for (const r of DATA.results) (byAth[r.a] ||= []).push(r);
const stByAth = {}; for (const s of DATA.standings) (stByAth[s.a] ||= []).push(s);

let state = {view:'results', g:'W', ev:DATA.events[DATA.events.length-1].id, nat:'', q:'', sort:'i', dir:1, open:null, ha:'', hb:'', fol:false};

/* ---------- shareable links: the address bar always describes what's on screen ---------- */
const slugOf = n => n.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const SLUG = {}, ID_BY_SLUG = {};
for (const [id, a] of Object.entries(DATA.athletes)){ a.id = id; let sl = slugOf(a.n); if (ID_BY_SLUG[sl]) sl += '-' + id.toLowerCase(); SLUG[id] = sl; ID_BY_SLUG[sl] = id; }
const VIEWS = ['results','sf','q','all','h2h','relay'];
const RELAY_EVENTS = DATA.events.filter(e => (DATA.relays || []).some(r => r.e === e.id));
let scrollToOpen = false;
function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (![...h.keys()].length) return false;
  const v = h.get('tab'); state.view = VIEWS.includes(v) ? v : 'results';
  const g = h.get('g'); if (g === 'W' || g === 'M' || (g === 'X' && state.view === 'relay')) state.g = g;
  const ev = h.get('ev'); if (ev && DATA.events.some(e => e.id === ev)) state.ev = ev;
  state.nat = (h.get('n') || '').toUpperCase();
  state.open = null; state.q = ''; $('q').value = '';
  const a = ID_BY_SLUG[h.get('a') || ''];
  if (a){
    state.g = DATA.athletes[a].g; state.open = a; scrollToOpen = true;
    if (!v) state.view = 'all';   // every athlete appears in the Averages tab
    if (state.view === 'results' && !(DATA.standings.some(x => x.a === a && x.e === state.ev))){
      const last = [...DATA.standings].reverse().find(x => x.a === a); if (last) state.ev = last.e;
    }
  }
  const pair = (h.get('h2h') || '').split(',').map(x => ID_BY_SLUG[x]).filter(Boolean);
  if (pair.length){
    state.view = 'h2h'; state.g = DATA.athletes[pair[0]].g;
    $('ha').value = DATA.athletes[pair[0]].n; $('hb').value = pair[1] ? DATA.athletes[pair[1]].n : '';
  }
  return true;
}
function currentPair(){
  const m = {}; for (const [id, a] of Object.entries(DATA.athletes)) if (a.g === state.g) m[a.n.toLowerCase()] = id;
  return [m[$('ha').value.trim().toLowerCase()], m[$('hb').value.trim().toLowerCase()]];
}
function writeHash(){
  const h = new URLSearchParams();
  if (state.view !== 'results') h.set('tab', state.view);
  if (state.g !== 'W') h.set('g', state.g);
  if ((state.view === 'results' || state.view === 'relay') && state.ev !== DATA.events[DATA.events.length-1].id) h.set('ev', state.ev);
  if (state.nat) h.set('n', state.nat);
  if (state.view !== 'h2h' && state.open) h.set('a', SLUG[state.open]);
  if (state.view === 'h2h'){ const [a, b] = currentPair(); if (a) h.set('h2h', [a, b].filter(Boolean).map(x => SLUG[x]).join(',')); }
  const str = h.toString();
  const url = location.pathname + location.search + (str ? '#' + str : '');
  if (url !== location.pathname + location.search + location.hash) history.replaceState(null, '', url);
}
function syncControls(){
  $('view').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === state.view));
  $('gender').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.g === state.g));
}
const shareUrl = hash => location.origin + location.pathname + '#' + hash;

const avg = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : null;
const fmt = v => v === null || v === undefined ? '–' : (Number.isInteger(v) ? String(v) : v.toFixed(1));
const idOf = {}; for (const [id, a] of Object.entries(DATA.athletes)) idOf[a.n + '|' + a.g] = id;
const matches = a => (!state.fol || SITE.follow.has(a.id || idOf[a.n + '|' + a.g])) && (!state.nat || a.c === state.nat) && (!state.q || (a.n + ' ' + a.c + ' ' + (a.alt || []).join(' ')).toLowerCase().includes(state.q));
const roundName = r => t('r.' + r.r) + (r.grp ? ' ' + esc(r.grp) : '');

function cell(x, d){
  if (x.p === undefined) return '<span class="el">' + esc(x.st) + '</span>';
  let raw;
  if (d === 'f') raw = x.de ? t('raw.de', {n:x.rk}) : (x.v !== undefined ? t('raw.vd', {v:x.v, d:x.d}) : '');
  else raw = esc(x.t.replace(/^00:/, '')) + ' (' + x.rk + ')';
  return x.p + '<span class="raw">' + raw + '</span>';
}

/* ---------- progress charts (small multiples, one per discipline) ---------- */
// per competition: average points in that discipline over the athlete's rounds there
function perComp(id, d){
  const out = {};
  for (const ev of DATA.events){
    const v = avg((byAth[id] || []).filter(r => r.e === ev.id && r[d].p !== undefined).map(r => r[d].p));
    if (v !== null) out[ev.id] = v;
  }
  return out;
}
function chart(title, series, evIds){
  const W = 300, H = 140, L = 34, R = 34, T = 14, B = 26;
  const vals = series.flatMap(s => evIds.map(e => s.v[e]).filter(v => v !== undefined));
  if (!vals.length) return '';
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max(4, (hi - lo) * 0.15); lo = Math.floor((lo - pad) / 5) * 5; hi = Math.ceil((hi + pad) / 5) * 5;
  const x = i => evIds.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (evIds.length - 1);
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  let g = '';
  for (const v of [lo, (lo + hi) / 2, hi]){ g += '<line class="gl" x1="' + L + '" x2="' + (W - R + 6) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + Math.round(v) + '</text>'; }
  evIds.forEach((e, i) => { const lbl = evShort(evById[e]).replace(/^(WC|VK|EB|VB|Euros|Worlds) /, ''); g += '<text class="ax" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(lbl) + '</text>'; });
  for (const s of series){
    let path = '', open = false;
    evIds.forEach((e, i) => { const v = s.v[e]; if (v === undefined){ open = false; return; } path += (open ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); open = true; });
    g += '<path class="ln" d="' + path + '" stroke="' + s.color + '"/>';
    let last = -1;
    evIds.forEach((e, i) => {
      const v = s.v[e]; if (v === undefined) return; last = i;
      const tip = esc(s.name + ' · ' + evName(evById[e]) + ': ' + v.toFixed(1));

function progress(ids){

/* ---------- strength profile: where an athlete stands in the field, per discipline ---------- */
const secs = s => { const p = String(s).split(':').map(Number); return p.length === 2 ? p[0] * 60 + p[1] : p[0]; };
const fmtSecs = v => { if (v >= 60){ const m = Math.floor(v / 60); return m + ':' + (v - m * 60).toFixed(2).padStart(5, '0'); } return v.toFixed(2); };
const SP = {};   // SP[g][d] = {val:{id:value}, sorted:[values best→worst]}
(function(){
  for (const g of ['W','M']){
    SP[g] = {};
    const ids = Object.keys(DATA.athletes).filter(id => DATA.athletes[id].g === g);
    for (const d of DISC){
      const val = {};
      for (const id of ids){
        const rs = byAth[id] || [];
        if (d === 'f'){
          let v = 0, n = 0; for (const r of rs) if (r.f.v !== undefined){ v += r.f.v; n += r.f.v + r.f.d; }
          if (n) val[id] = v / n;
        } else {
          const ts = rs.filter(r => r[d].p !== undefined && r[d].t).map(r => secs(r[d].t)).filter(x => x > 0);
          if (ts.length) val[id] = avg(ts);
        }
      }
      SP[g][d] = {val, n: Object.keys(val).length};
    }
  }
})();
function standing(id, d){
  const g = DATA.athletes[id].g, S = SP[g][d], me = S.val[id];
  if (me === undefined) return null;
  const better = d === 'f' ? (x => x > me) : (x => x < me), worse = d === 'f' ? (x => x < me) : (x => x > me);
  let b = 0, w = 0; for (const x of Object.values(S.val)){ if (better(x)) b++; else if (worse(x)) w++; }
  const pct = S.n > 1 ? w / (S.n - 1) : 1;           // share of the rest of the field this athlete beats
  return {me, rank: b + 1, n: S.n, pct};
}
function strength(id){
  const a = DATA.athletes[id];
  const rows = DISC.map(d => ({d, st: standing(id, d)}));
  const have = rows.filter(r => r.st);
  if (!have.length) return '';
  let h = '<div class="sp"><h3>' + t('sp.title') + '</h3><p class="s">' + t('sp.sub', {g: t('sp.g' + a.g)}) + '</p>';
  for (const {d, st} of rows){
    if (!st){ h += '<div class="row na"><div class="lbl"><b>' + t('d.' + d) + '</b></div><div class="track"><span class="mid"></span></div><div class="val"><b>–</b><small>' + t('sp.na') + '</small></div></div>'; continue; }
    const p = Math.round(st.pct * 100), topP = Math.max(1, Math.round(st.rank / st.n * 100));
    const botP = Math.max(1, 100 - Math.round((st.rank - 1) / st.n * 100));
    const label = topP <= 45 ? t('sp.top', {p: topP}) : botP <= 45 ? t('sp.bottom', {p: botP}) : t('sp.mid');
    const info = d === 'f' ? t('sp.win', {p: Math.round(st.me * 100)}) : t('sp.avg', {t: fmtSecs(st.me)});
    h += '<div class="row" title="' + esc(t('d.' + d) + ': ' + label + ' · ' + t('sp.rank', {r: st.rank, n: st.n})) + '"><div class="lbl"><b>' + t('d.' + d) + '</b><small>' + info + '</small></div>'
      + '<div class="track" role="img" aria-label="' + esc(t('d.' + d) + ': ' + label) + '"><span class="fill" style="width:' + Math.max(3, p) + '%"></span><span class="mid"></span></div>'
      + '<div class="val"><b>' + label + '</b><small>' + t('sp.rank', {r: st.rank, n: st.n}) + '</small></div></div>';
  }
  if (have.length > 1){
    const best = have.reduce((x, y) => y.st.pct > x.st.pct ? y : x), weak = have.reduce((x, y) => y.st.pct < x.st.pct ? y : x);
    h += '<div class="sum"><span>💪 ' + t('sp.best') + ': <b>' + t('d.' + best.d) + '</b></span>' + (weak !== best ? '<span>🎯 ' + t('sp.grow') + ': <b>' + t('d.' + weak.d) + '</b></span>' : '') + '</div>';
  }
  return h + '</div>';
}

function detail(id){

function viewResults(){
  const groups = {F:[], SF:[], Q:[]};
  for (const s of DATA.standings){
    if (s.e !== state.ev) continue;
    const a = DATA.athletes[s.a];
    if (!a || a.g !== state.g || !matches(a)) continue;
    const r = (byAth[s.a] || []).find(x => x.e === s.e && x.r === s.lvl);
    const row = {id:s.a, name:a.n, nat:a.c, i:s.rank, t:r ? r.tot : null};
    for (const d of DISC) row[d] = r && r[d].p !== undefined ? r[d].p : (r ? r[d].st : null);
    groups[s.lvl].push(row);
  }
  return {cols:DISC.map(k => ({k})), rankLabel:t('rank'), groups:[{title:t('grp.F'), rows:groups.F},{title:t('grp.SF'), rows:groups.SF},{title:t('grp.Q'), rows:groups.Q}]};
}
function seasonLevel(id){
  const sts = stByAth[id] || [];
  return {finals:sts.filter(s => s.lvl === 'F').length, semis:sts.filter(s => s.lvl === 'SF').length, best:sts.reduce((b,s) => RORD[s.lvl] > RORD[b] ? s.lvl : b, 'Q')};
}
function seasonRow(id, phase){
  const a = DATA.athletes[id];
  const keep = phase === 'q' ? (r => r.r === 'Q') : phase === 'sf' ? (r => r.r !== 'Q') : (r => true);
  const disc = phase === 'all' ? ['o','s','l'] : DISC;
  const rs = (byAth[id] || []).filter(keep);
  if (!rs.length) return null;
  const lv = seasonLevel(id);
  const row = {id, name:a.n, nat:a.c, n:rs.length, finals:lv.finals, semis:lv.semis, best:lv.best};
  for (const d of disc) row[d] = avg(rs.filter(r => r[d].p !== undefined).map(r => r[d].p));
  const full = rs.filter(r => disc.every(d => r[d].p !== undefined));
  row.t = avg(full.map(r => phase === 'all' ? disc.reduce((x,d) => x + r[d].p, 0) : r.tot));
  return row;
}
function viewAverages(phase){
  const all = [];
  for (const [id, a] of Object.entries(DATA.athletes)){
    if (a.g !== state.g || !matches(a)) continue;
    const row = seasonRow(id, phase); if (row) all.push(row);
  }
  if (phase === 'all') all.sort((a,b) => (b.t ?? -1) - (a.t ?? -1));
  else all.sort((a,b) => b.finals - a.finals || b.semis - a.semis || (b.t ?? -1) - (a.t ?? -1));
  all.forEach((r,i) => r.i = i+1);
  const by = lvl => all.filter(r => r.best === lvl);
  const groups = phase === 'all' ? [{title:t('grp.all'), rows:all}]
    : phase === 'q' ? [{title:t('grp.reachedF'), rows:by('F')},{title:t('grp.reachedSF'), rows:by('SF')},{title:t('grp.qOnly'), rows:by('Q')}]
    : [{title:t('grp.reachedF'), rows:by('F')},{title:t('grp.sfOnly'), rows:by('SF')}];
  const disc = phase === 'all' ? ['o','s','l'] : DISC;
  return {cols:[{k:'n', cls:'n'}, ...disc.map(k => ({k}))], rankLabel:'#', totalLabel: phase === 'all' ? t('combined') : t('total'), groups};
}

  if (!relay && state.g === 'X') state.g = 'W';
  $('gender').querySelector('[data-g="X"]').hidden = !relay;
  $('event').style.display = (state.view === 'results' || relay) ? '' : 'none';
  $('q').style.display = h2h ? 'none' : '';
  $('folBtn').style.display = h2h ? 'none' : ''; $('folBtn').setAttribute('aria-pressed', String(state.fol)); $('folN').textContent = SITE.follow.list().length;
  $('listWrap').hidden = h2h; $('h2h').hidden = !h2h;
  $('hint').textContent = t(HINT[state.view]);
  if (h2h) renderH2H(); else if (relay) renderRelays(); else renderList();
  syncControls(); writeHash();
  if (scrollToOpen){ scrollToOpen = false; const row = document.querySelector('tr.ath.open'); if (row) requestAnimationFrame(() => row.scrollIntoView({block:'start', behavior:'smooth'})); }
}

readHash();
fillSelects();
window.addEventListener('hashchange', () => { if (readHash()){ fillSelects(); render(); } });
document.addEventListener('click', e => {
  const b = e.target.closest('.sharebtn'); if (!b) return;
  e.stopPropagation();
  if (b.dataset.share === 'a'){ const a = DATA.athletes[b.dataset.id]; SITE.share(shareUrl('a=' + SLUG[b.dataset.id]), a.n, b); }
  else { const [a, c] = currentPair(); if (a && c) SITE.share(shareUrl('h2h=' + SLUG[a] + ',' + SLUG[c]), DATA.athletes[a].n + ' – ' + DATA.athletes[c].n, b); }
}, true);
$('view').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.view = b.dataset.v; state.open = null; state.sort = 'i'; state.dir = 1;
  if (state.view !== 'relay' && state.g === 'X') state.g = 'W';
  fillSelects();
  $('view').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
$('gender').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.g = b.dataset.g; state.open = null; $('ha').value = ''; $('hb').value = '';
  $('gender').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  fillSelects(); render();
});
$('event').addEventListener('change', e => { state.ev = e.target.value; state.open = null; fillSelects(); render(); });
$('nation').addEventListener('change', e => { state.nat = e.target.value; state.open = null; render(); });
$('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
['ha','hb'].forEach(id => $(id).addEventListener('input', () => { if (state.view === 'h2h'){ renderH2H(); writeHash(); } }));
$('head').addEventListener('click', e => {
  const th = e.target.closest('th'); if (!th) return;
  const k = th.dataset.k;
  if (state.sort === k) state.dir = -state.dir; else { state.sort = k; state.dir = (k === 'name' || k === 'i') ? 1 : -1; }
  render();
});
$('body').addEventListener('click', e => {
  const tr = e.target.closest('tr.ath'); if (!tr) return;
  state.open = state.open === tr.dataset.id ? null : tr.dataset.id;
  render();
});
SITE.onLang(() => { fillSelects(); render(); });
$('folBtn').addEventListener('click', () => { state.fol = !state.fol; state.open = null; render(); });
let prevFol = SITE.follow.list();
SITE.follow.onChange(list => {
  const changed = list.find(x => !prevFol.includes(x)) || prevFol.find(x => !list.includes(x)); prevFol = list;
  render();
  if (changed && !SITE.calm()) document.querySelectorAll('[data-follow="' + changed + '"]').forEach(b => b.classList.add('pop'));
});
SITE.onTheme(render);
render();
</script>
</body>
</html>
