<style>
:root{--tint:#f5f8ff;--bg:#ffffff;--card:#ffffff;--text:#0b1b3a;--muted:#5a6b85;--line:#dde5f0;--accent:#1d4ed8;--ink:#ffffff;--soft:#eef4ff;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 56px}
a{color:inherit}

/* hero: same design as the share preview */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:34px 38px 30px;margin:4px 0 36px;color:#fff;font-family:Inter,"Inter Display",system-ui,sans-serif;
  background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 45%,#14287a 100%);box-shadow:0 20px 50px rgba(20,40,122,.25)}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1a46b8 0%,#12318f 45%,#081544 100%);box-shadow:none;border:1px solid #1e2a3d}
.hero .g1{position:absolute;left:-18%;top:-55%;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(147,197,253,.55),rgba(96,165,250,0) 65%);pointer-events:none}
.hero .g2{position:absolute;right:-20%;bottom:-70%;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.38),rgba(34,211,238,0) 62%);pointer-events:none}
.hero .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 1.2px,transparent 1.3px);background-size:24px 24px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hero .brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:1rem;opacity:.95}
.hero .brand svg{width:44px;height:44px;display:block;border-radius:11px;box-shadow:0 6px 16px rgba(8,20,80,.3)}
.hero .by{font-weight:600;font-size:.9rem;opacity:.88;margin:0}
.hero h1{font-weight:900;font-size:clamp(2.3rem,7.2vw,4.6rem);line-height:1;letter-spacing:-.035em;margin:26px 0 10px;max-width:none}
.hero .tag{font-size:clamp(.95rem,2.2vw,1.12rem);font-weight:500;opacity:.92;margin:0}
.hero .row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:28px}
.pcard{border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07));border:1.5px solid rgba(255,255,255,.28);
  box-shadow:0 14px 32px rgba(8,20,80,.25),inset 0 1px 0 rgba(255,255,255,.35);overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:4px 0 14px}
.pcard .art{width:100%}
.pcard svg{display:block;width:100%;height:auto}
.pcard span{font-weight:700;font-size:.95rem;letter-spacing:.01em;margin-top:2px}
@media (max-width:760px){
  .hero{padding:24px 20px 22px;border-radius:22px}
  .hero h1{margin-top:20px}
  .hero .row{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:42%;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:20px;scrollbar-width:none;margin:22px -20px 0;padding:0 20px 6px}
  .hero .row::-webkit-scrollbar{display:none}
  .pcard{scroll-snap-align:start}
}

/* effects */
.hero .spot{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.16),transparent 60%)}
.hero:hover .spot{opacity:1}
.hero h1 .shine{background:linear-gradient(100deg,#fff 0%,#fff 40%,#bfe3ff 50%,#fff 60%,#fff 100%);background-size:250% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.pcard{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,background-color .35s}
@media (prefers-reduced-motion:no-preference){
  @keyframes drift1{50%{transform:translate(6%,8%) scale(1.08)}}
  @keyframes drift2{50%{transform:translate(-7%,-6%) scale(1.1)}}
  @keyframes bob{50%{transform:translateY(-7px)}}
  @keyframes shine{0%,55%{background-position:100% 0}100%{background-position:-50% 0}}
  @keyframes cardin{from{opacity:0;transform:translateY(26px) scale(.96)}}
  .hero .g1{animation:drift1 14s ease-in-out infinite}
  .hero .g2{animation:drift2 17s ease-in-out infinite}
  .hero h1 .shine{animation:shine 6s ease-in-out 1s infinite}
  .pcard{animation:cardin .7s cubic-bezier(.2,.7,.2,1) both}
  .pcard .art{animation:bob 4.2s ease-in-out infinite}
  .pcard:nth-child(1){animation-delay:.10s}.pcard:nth-child(2){animation-delay:.18s}.pcard:nth-child(3){animation-delay:.26s}.pcard:nth-child(4){animation-delay:.34s}.pcard:nth-child(5){animation-delay:.42s}
  .pcard:nth-child(2) .art{animation-delay:-.8s}.pcard:nth-child(3) .art{animation-delay:-1.6s}.pcard:nth-child(4) .art{animation-delay:-2.4s}.pcard:nth-child(5) .art{animation-delay:-3.2s}
  .pcard:hover{transform:translateY(-8px) rotate(-1.5deg);box-shadow:0 22px 44px rgba(8,20,80,.35),inset 0 1px 0 rgba(255,255,255,.45);background-color:rgba(255,255,255,.08)}
  .pcard:nth-child(even):hover{transform:translateY(-8px) rotate(1.5deg)}
  .nextbar b{display:inline-block;min-width:2ch}
}

/* discipline info panel under the cards */
.pcard{position:relative;cursor:pointer;outline:none}
.pcard:focus-visible{box-shadow:0 0 0 3px #fff,0 14px 32px rgba(8,20,80,.25)}
.hero .row.focus .pcard:not(.on){opacity:.55}
.pcard.on{background-color:rgba(255,255,255,.12);border-color:rgba(255,255,255,.75)}
.pinfo{margin-top:16px;min-height:140px;border-radius:18px;background:rgba(8,20,80,.28);border:1.5px solid rgba(255,255,255,.18);padding:16px 20px;display:flex;align-items:center}
.pinfo .pchint{margin:0;width:100%;font-size:.88rem;opacity:.8;text-align:center}
.pinfo .in{display:grid;grid-template-columns:150px 1fr 1fr;gap:6px 22px;width:100%;align-items:start}
.pinfo h3{margin:0;font-size:1.2rem;font-weight:900;letter-spacing:-.01em}
.pinfo small{display:block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:#93c5fd;margin-bottom:3px}
.pinfo .ff small{color:#fcd34d}
.pinfo p{margin:0;font-size:.9rem;line-height:1.45}
.pcard,.hero .row .pcard{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,background-color .35s,opacity .25s,border-color .25s}
@media (prefers-reduced-motion:no-preference){@keyframes pin{from{opacity:0;transform:translateY(6px)}}.pinfo .in{animation:pin .3s cubic-bezier(.2,.7,.2,1)}}
@media (max-width:1000px){.pinfo{min-height:162px}}
@media (max-width:760px){.pinfo{min-height:0;padding:14px 16px}.pinfo .in{grid-template-columns:1fr;gap:10px}.pinfo p{font-size:.86rem}}

/* Los Angeles 2028 countdown */
.la{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;border-radius:24px;padding:26px 30px;margin:0 0 30px;color:#fff;
  background:linear-gradient(120deg,#c2410c 0%,#be185d 48%,#5b21b6 100%);box-shadow:0 18px 44px rgba(190,24,93,.22)}
:root[data-theme="dark"] .la{background:linear-gradient(120deg,#9a3412 0%,#9d174d 48%,#3b0f7a 100%);box-shadow:none;border:1px solid #3b1d3a}
.la .glow{position:absolute;right:-12%;top:-70%;width:55%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(253,186,116,.45),rgba(253,186,116,0) 65%);pointer-events:none}
.la>*{position:relative}
.la .badge{width:150px;height:150px;display:block;filter:drop-shadow(0 10px 22px rgba(60,10,60,.35))}
.la .k{font-size:.76rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.88}
.la h2{margin:4px 0 2px;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:900;letter-spacing:-.025em;line-height:1.1}
.la .where{opacity:.92;font-size:.95rem}
.la .cd{display:flex;gap:10px;margin:16px 0 4px;flex-wrap:wrap}
.la .cd div{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.26);border-radius:14px;padding:10px 6px;min-width:76px;text-align:center}
.la .cd b{display:block;font-size:clamp(1.5rem,4.5vw,2.2rem);font-weight:900;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.la .cd span{display:block;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.85;margin-top:5px}
.la .until{font-size:.82rem;opacity:.85;margin:0 0 12px}
.la .sess{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.la .sess li{font-size:.8rem;background:rgba(0,0,0,.16);border-radius:999px;padding:5px 11px}
.la .sess b{font-weight:700}
.la .sess small{opacity:.8}
.la .live{display:inline-block;margin:16px 0 12px;font-size:1.15rem;font-weight:800;background:rgba(255,255,255,.18);border-radius:999px;padding:8px 16px}
@media (prefers-reduced-motion:no-preference){
  @keyframes sunrise{from{transform:translateY(5px)}to{transform:translateY(-3px)}}
  @keyframes sway{50%{transform:rotate(2.5deg)}}
  .la .sun{animation:sunrise 5s ease-in-out infinite alternate}
  .la .palm{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
  .la .palm2{animation-delay:-3s}
  .la .cd b.tk{animation:tickin .35s cubic-bezier(.2,.7,.2,1)}
  @keyframes tickin{from{transform:translateY(-35%);opacity:.2}}
}
@media (max-width:640px){.la{grid-template-columns:1fr;gap:12px;padding:22px 18px;border-radius:20px}.la .badge{width:96px;height:96px}.la .cd{gap:6px}.la .cd div{flex:1;min-width:0;padding:9px 2px}.la .sess li{border-radius:12px;width:100%}}

.nextbar{display:flex;align-items:center;gap:12px;margin:-14px 0 28px;padding:14px 18px;border-radius:16px;background:var(--soft);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600}
.nextbar:hover{border-color:var(--accent)}
.nextbar b{color:var(--accent);font-size:1.25rem;font-variant-numeric:tabular-nums}
.nextbar .go2{margin-left:auto;color:var(--accent);white-space:nowrap}
.nextbar .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block}
.go{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:48px}
.go a{display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 1px 3px rgba(29,78,216,.06);transition:border-color .15s,transform .15s}
.go a:hover{border-color:var(--accent);transform:translateY(-2px)}
.go a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.go a.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.go h2{margin:0;font-size:1.25rem;letter-spacing:-.01em}
.go p{margin:0;opacity:.8;font-size:.95rem}
.go .arrow{margin-top:auto;padding-top:10px;font-weight:700;font-size:.9rem}

h3.sec{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.disc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.disc div{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:16px}
.disc .n{font-size:.75rem;font-weight:700;color:var(--accent)}
.disc h4{margin:2px 0 6px;font-size:1.05rem}
.disc p{margin:0;font-size:.88rem;color:var(--muted)}
.disc b{color:var(--text);font-weight:600}

footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
@media (max-width:640px){.wrap{padding:12px 16px 48px}}
</style>

<script>
(function(){
  const bar = document.getElementById('nextbar'), cal = window.CALENDAR; if (!cal) return;
  const startMs = e => Date.parse(e.start + 'T00:00:00' + (e.utc || 'Z')), endMs = e => Date.parse(e.end + 'T23:59:59' + (e.utc || 'Z'));
  function draw(){
    const now = Date.now(), e = cal.events.filter(x => x.start && endMs(x) >= now).sort((a, b) => startMs(a) - startMs(b))[0];
    if (!e){ bar.hidden = true; return; }
    const n = Math.max(0, Math.ceil((startMs(e) - now) / 86400000));
    const name = SITE.lang === 'hu' && e.name_hu ? e.name_hu : e.name;
    bar.innerHTML = '<b>' + (startMs(e) <= now ? '●' : n) + '</b><span><span class="lbl">' + SITE.t('nx.next') + '</span>' + name + ' · ' + (startMs(e) <= now ? SITE.t('nx.now') : (n === 1 ? SITE.t('nx.tomorrow') : SITE.t('nx.inDays', {n}))) + '</span><span class="go2">' + SITE.t('nx.title') + ' →</span>';
    bar.hidden = false;
    if (!drawn && startMs(e) > now && SITE.countUp) SITE.countUp(bar.querySelector('b'), n, 1100);
    drawn = true;
  }
  let drawn = false;
  SITE.onLang(draw); draw();
})();
(function(){
  // LA28 modern pentathlon sessions (Pacific Daylight Time, UTC−7), from the official LA28 / UIPM schedule
  const S = [['2028-07-15T09:00:00-07:00','la.ws'],['2028-07-16T09:00:00-07:00','la.ms'],['2028-07-17T09:00:00-07:00','la.wf'],['2028-07-18T09:00:00-07:00','la.mf']];
  const START = Date.parse(S[0][0]), END = Date.parse('2028-07-18T11:00:00-07:00');
  const box = document.getElementById('laBox'), list = document.getElementById('laSess'); if (!box) return;
  const loc = () => SITE.lang === 'hu' ? 'hu-HU' : 'en-GB';
  let intro = false;
  function draw(){
    const now = Date.now();
    if (now >= END) box.innerHTML = '<div class="live">' + SITE.t('la.done') + '</div>';
    else if (now >= START) box.innerHTML = '<div class="live">● ' + SITE.t('la.now') + '</div>';
    else box.innerHTML = '<div class="cd" role="timer" aria-live="off">' + ['nx.d','nx.h','nx.m','nx.s'].map(k => '<div><b>–</b><span>' + SITE.t(k) + '</span></div>').join('') + '</div><p class="until">' + SITE.t('la.until') + '</p>';
    list.innerHTML = S.map(([iso, k]) => { const d = new Date(iso);
      const day = d.toLocaleDateString(loc(), {timeZone: 'America/Los_Angeles', weekday: 'short', month: 'short', day: 'numeric'});
      const mine = d.toLocaleTimeString(loc(), {hour: '2-digit', minute: '2-digit'});
      return '<li><b>' + day + '</b> · ' + SITE.t(k) + ' <small>· 9:00 ' + SITE.t('la.la') + (mine.replace(/^0/, '') !== '9:00' ? ' / ' + mine + ' ' + SITE.t('la.you') : '') + '</small></li>'; }).join('');
    tick();
  }
  function tick(){
    const bs = box.querySelectorAll('.cd b'); if (!bs.length) return;
    const ms = START - Date.now(); if (ms <= 0) { draw(); return; }
    const s = Math.floor(ms / 1000), parts = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
    if (!intro){ intro = true; bs.forEach((b, i) => b.textContent = i ? String(parts[i]).padStart(2, '0') : parts[i]);
      if (SITE.countUp && !SITE.calm()) { box.dataset.intro = 1; SITE.countUp(bs[0], parts[0], 1300); setTimeout(() => delete box.dataset.intro, 1350); } return; }
    if (box.dataset.intro) return;
    bs.forEach((b, i) => { const v = i ? String(parts[i]).padStart(2, '0') : String(parts[i]);
      if (b.textContent !== v){ const first = b.textContent === '–'; b.textContent = v; if (!first){ b.classList.remove('tk'); void b.offsetWidth; b.classList.add('tk'); } } });
  }
  SITE.onLang(draw); draw(); setInterval(tick, 1000);
})();
(function(){
  // hover (computer), tap (phone) or Enter/Space (keyboard) shows what you do + a fun fact under the cards
  const row = document.querySelector('.hero .row'), panel = document.getElementById('pinfo'), cards = [...row.querySelectorAll('.pcard')];
  const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
  let shown = null, pinned = null;
  function show(k){
    if (k === shown) return; shown = k;
    cards.forEach(c => { const on = c.dataset.k === k; c.classList.toggle('on', on); c.setAttribute('aria-pressed', String(on)); });
    row.classList.toggle('focus', !!k);
    const t = SITE.t;
    panel.innerHTML = k ? '<div class="in"><h3>' + t('disc.' + k) + '</h3><div><small>' + t('pc.do') + '</small><p>' + t('pc.' + k + '.do') + '</p></div><div class="ff"><small>' + t('pc.ff') + '</small><p>' + t('pc.' + k + '.ff') + '</p></div></div>'
      : '<p class="pchint">' + t('pc.hint') + '</p>';
  }
  cards.forEach(c => {
    if (fine) c.addEventListener('mouseenter', () => show(c.dataset.k));
    c.addEventListener('click', () => { pinned = pinned === c.dataset.k && !fine ? null : c.dataset.k; show(pinned); });
    c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); c.click(); } });
    c.addEventListener('focus', () => { if (fine) show(c.dataset.k); });
  });
  if (fine) row.addEventListener('mouseleave', () => show(pinned));
  document.addEventListener('click', e => { if (!e.target.closest('.hero .row')) { pinned = null; show(null); } });
  SITE.onLang(() => { const k = shown; shown = undefined; show(k); });
})();
(function(){
  const h = document.querySelector('.hero'); if (!h || !matchMedia('(pointer:fine)').matches) return;
  h.addEventListener('pointermove', e => { const r = h.getBoundingClientRect(); h.style.setProperty('--mx', (e.clientX - r.left) + 'px'); h.style.setProperty('--my', (e.clientY - r.top) + 'px'); });
})();
</script>
