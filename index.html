<style>
:root{--tint:#f5f8ff;--bg:#ffffff;--card:#ffffff;--text:#0b1b3a;--muted:#5a6b85;--line:#dde5f0;--accent:#1d4ed8;--ink:#ffffff;--soft:#eef4ff;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 56px}
a{color:inherit}

.hero{padding:44px 0 36px}
.title{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-style:italic;font-weight:800;font-size:clamp(2.8rem,10vw,5.6rem);line-height:1;letter-spacing:-.02em;margin:0;max-width:none;
  background:linear-gradient(100deg,#0b2a8a 0%,#1d4ed8 45%,#3b82f6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.by{margin:14px 0 0;font-size:.82rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
h1{font-size:clamp(2.1rem,6vw,3.4rem);line-height:1.05;letter-spacing:-.03em;margin:0 0 16px;max-width:14ch}
.lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin:0}
.stripe{display:flex;gap:6px;margin-top:28px;max-width:420px}
.stripe span{flex:1;height:6px;border-radius:3px;background:var(--accent)}
.stripe span:nth-child(2){opacity:.8}.stripe span:nth-child(3){opacity:.6}.stripe span:nth-child(4){opacity:.4}

.go{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:48px}
.go a{display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 1px 3px rgba(29,78,216,.06);transition:border-color .15s,transform .15s}
.go a:hover{border-color:var(--accent);transform:translateY(-2px)}
.go a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.go a.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.go h2{margin:0;font-size:1.25rem;letter-spacing:-.01em}
.go p{margin:0;opacity:.8;font-size:.95rem}
.go .arrow{margin-top:auto;padding-top:10px;font-weight:700;font-size:.9rem}

h3.sec{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.disc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.disc div{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:16px}
.disc .n{font-size:.75rem;font-weight:700;color:var(--accent)}
.disc h4{margin:2px 0 6px;font-size:1.05rem}
.disc p{margin:0;font-size:.88rem;color:var(--muted)}
.disc b{color:var(--text);font-weight:600}

footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
@media (max-width:640px){.hero{padding:28px 0 28px}.wrap{padding:12px 16px 48px}}
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav"></nav>

  <header class="hero">
    <h1 class="title">Modern Pentathlon</h1>
    <p class="by" data-i18n="home.by"></p>
    <div class="stripe" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  </header>

  <section class="go" aria-label="Get started">
    <a href="/calculator" class="primary">
      <h2 data-i18n="home.calcT"></h2>
      <p data-i18n="home.calcP"></p>
      <span class="arrow" data-i18n="home.calcA"></span>
    </a>
    <a href="/athletes">
      <h2 data-i18n="home.athT"></h2>
      <p data-i18n="home.athP"></p>
      <span class="arrow" data-i18n="home.athA"></span>
    </a>
    <a href="/bests">
      <h2 data-i18n="home.bestT"></h2>
      <p data-i18n="home.bestP"></p>
      <span class="arrow" data-i18n="home.bestA"></span>
    </a>
  </section>

  <section aria-labelledby="how">
    <h3 class="sec" id="how" data-i18n="home.how"></h3>
    <div class="disc">
      <div><span class="n">01</span><h4 data-i18n="d.f"></h4><p data-i18n-html="home.f"></p></div>
      <div><span class="n">02</span><h4 data-i18n="d.o"></h4><p data-i18n-html="home.o"></p></div>
      <div><span class="n">03</span><h4 data-i18n="d.s"></h4><p data-i18n-html="home.s"></p></div>
      <div><span class="n">04</span><h4 data-i18n="d.l"></h4><p data-i18n-html="home.l"></p></div>
    </div>
  </section>

  <footer data-i18n="footer"></footer>
</div>
</body>
