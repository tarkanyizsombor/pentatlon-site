<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About · Modern Pentathlon by Tárkányi Zsombor</title>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<script src="common.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,800&display=swap" rel="stylesheet">
<style>
:root{--tint:#f5f8ff;--bg:#ffffff;--card:#ffffff;--text:#0b1b3a;--muted:#5a6b85;--line:#dde5f0;--accent:#1d4ed8;--ink:#ffffff;--soft:#eef4ff;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 56px}
.title{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-style:italic;font-weight:800;font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;margin:28px 0 0;
  background:linear-gradient(100deg,#0b2a8a 0%,#1d4ed8 45%,#3b82f6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.by{margin:10px 0 0;font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h2{font-size:1.15rem;margin:36px 0 10px}
p{margin:0 0 14px;max-width:65ch}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:6px}
.contact a{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:border-color .15s}
.contact a:hover{border-color:var(--accent)}
.contact a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.contact svg{width:26px;height:26px;flex:none;color:var(--accent)}
.contact small{display:block;font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.contact b{font-weight:600;word-break:break-all}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav"></nav>
  <div class="title">Modern Pentathlon</div>
  <p class="by" data-i18n="home.by"></p>

  <h2 data-i18n="about.title"></h2>
  <p data-i18n="about.p1"></p>
  <p data-i18n="about.p2"></p>
  <p data-i18n="about.p3"></p>

  <h2 data-i18n="about.contact"></h2>
  <div class="contact">
    <a href="https://www.instagram.com/zsombortarkanyi/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      <span><small data-i18n="about.insta"></small><b>@zsombortarkanyi</b></span>
    </a>
    <a href="mailto:tarkanyi.zsombor@gmail.com">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></svg>
      <span><small data-i18n="about.email"></small><b>tarkanyi.zsombor@gmail.com</b></span>
    </a>
  </div>

  <footer data-i18n="footer"></footer>
</div>
</body>
</html>
