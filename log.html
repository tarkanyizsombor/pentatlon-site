<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A modern pentathlon training diary: write down what you trained in fencing, obstacle, swimming, shooting, running and laser run, and count your sessions per month and year. Saved on your device.">
<link rel="canonical" href="https://ottusaeredmenyek.com/log">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/site.webmanifest?v=2">
<meta name="theme-color" content="#1d4ed8">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Modern Pentathlon by Tárkányi Zsombor">
<meta property="og:title" content="Training Log · Modern Pentathlon">
<meta property="og:description" content="A modern pentathlon training diary: write down what you trained in fencing, obstacle, swimming, shooting, running and laser run, and count your sessions per month and year. Saved on your device.">
<meta property="og:url" content="https://ottusaeredmenyek.com/log">

<meta name="twitter:title" content="Training Log · Modern Pentathlon">
<meta name="twitter:description" content="A modern pentathlon training diary: write down what you trained in fencing, obstacle, swimming, shooting, running and laser run, and count your sessions per month and year. Saved on your device.">

<title>Training Log · Modern Pentathlon</title>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<script src="common.js"></script>
<style>
:root{--tint:#f5f8ff;--bg:#ffffff;--card:#ffffff;--text:#0b1b3a;--muted:#5a6b85;--line:#dde5f0;--accent:#1d4ed8;--ink:#ffffff;--soft:#eef4ff;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 6px;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(29,78,216,.06)}
label,.lbl{display:block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--tint);color:var(--text)}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:180px 1fr;gap:14px;margin-bottom:14px}
.row>div{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.9rem;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip small{font-weight:500;color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.chip:focus-visible,.btn:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mins{max-width:220px}
.actions{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 18px;background:var(--accent);color:var(--ink);cursor:pointer}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line)}
.msg{font-size:.88rem;color:var(--muted)}
.msg.err{color:#c0392b}

.monthbar{display:flex;align-items:center;gap:10px;margin:28px 0 10px}
.monthbar h2{margin:0;flex:1}
.nav{display:inline-flex;align-items:center;gap:6px}
.nav button{font:inherit;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:1.05rem;line-height:1}
.nav span{font-weight:700;min-width:9.5em;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile.all{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.tile .k{font-size:.78rem;font-weight:700;color:var(--muted)}
.tile.all .k,.tile.all .m,.tile.all .y{color:inherit;opacity:.85}
.tile .n{font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.05;color:var(--accent);font-variant-numeric:tabular-nums}
.tile.all .n{color:inherit}
.tile .y{font-size:.75rem;color:var(--muted)}
.tile .m{font-size:.82rem;font-weight:600;margin-top:6px}
.chart{margin-top:12px}
.chart h3{font-size:.85rem;margin:0 0 4px}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:10px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--s1);opacity:.45;cursor:pointer}
.chart .bar.sel{opacity:1}
.chart .val{fill:var(--text);font-size:10px;font-weight:700}
.day{margin-bottom:12px}
.day h3{font-size:.85rem;color:var(--muted);margin:0 0 6px;font-weight:700}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}
.what{white-space:pre-wrap;word-break:break-word}
.what small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.ops{display:flex;gap:6px}
.ops button{font:inherit;font-size:.78rem;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer}
.ops button:hover{color:var(--accent);border-color:var(--accent)}
.ops button.del:hover{color:#c0392b;border-color:#c0392b}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.note{font-size:.8rem;color:var(--muted);line-height:1.5}
@media (max-width:640px){
  .wrap{padding:12px 12px 40px}
  .row{grid-template-columns:1fr}
  .entry{grid-template-columns:1fr auto}.entry .tag{grid-column:1/-1;justify-self:start}
  .nav span{min-width:7.5em;font-size:.9rem}
  .monthbar{flex-wrap:wrap}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav"></nav>
  <header class="phead"><div class="ph-in"><h1 data-i18n="log.title"></h1>
    <p class="sub" data-i18n="log.sub"></p></div></header>

  <h2 id="formTitle" data-i18n="log.add"></h2>
  <div class="card" id="formCard">
    <div class="row">
      <div><label for="f-date" data-i18n="log.date"></label><input id="f-date" type="date"></div>
      <div><span class="lbl" data-i18n="log.disc"></span><div class="chips" id="chips" role="group"></div></div>
    </div>
    <label for="f-what" data-i18n="log.what"></label>
    <textarea id="f-what" maxlength="600" data-i18n-ph="log.whatPh"></textarea>
    <div style="margin-top:12px"><label for="f-mins" data-i18n="log.mins"></label><input id="f-mins" class="mins" inputmode="numeric" placeholder="60"></div>
    <div class="actions"><button class="btn" id="save" type="button"></button><button class="btn ghost" id="cancel" type="button" hidden data-i18n="log.cancel"></button><span class="msg" id="msg" role="status"></span></div>
  </div>

  <div class="monthbar">
    <h2 data-i18n="log.counts"></h2>
    <div class="nav"><button id="prev" type="button">‹</button><span id="monthLabel"></span><button id="next" type="button">›</button></div>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="card chart" id="chart"></div>

  <h2 id="histTitle"></h2>
  <div id="hist"></div>

  <h2 data-i18n="log.backup"></h2>
  <div class="card">
    <p class="note" style="margin:0 0 12px" data-i18n="log.backupHint"></p>
    <div class="actions" style="margin:0"><button class="btn ghost" id="exp" type="button" data-i18n="log.export"></button><button class="btn ghost" id="impBtn" type="button" data-i18n="log.import"></button><input id="imp" type="file" accept=".json,application/json" hidden><span class="msg" id="bmsg" role="status"></span></div>
  </div>
</div>
<script>
const t = SITE.t;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DISC = ['fen','obs','swim','shoot','run','lr','other'];
const loc = () => SITE.lang === 'hu' ? 'hu-HU' : 'en-GB';
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

/* ---------- storage (this device only) ---------- */
const KEY = 'mp.train';
const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(v) ? v : []; } catch(e){ return []; } };
const store = () => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch(e){} };
let list = load();

const now = new Date();
let view = {y: now.getFullYear(), m: now.getMonth() + 1};   // month shown in counts and history
let form = {d: null, editId: null};

const monthName = (y, m) => new Date(y, m - 1, 1).toLocaleDateString(loc(), {year:'numeric', month:'long'});
const dayName = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(loc(), {weekday:'long', day:'numeric', month:'long'}); };
const inMonth = (e, y, m) => e.date.startsWith(y + '-' + pad(m) + '-');
const inYear = (e, y) => e.date.startsWith(y + '-');

/* ---------- form ---------- */
function renderChips(){
  $('chips').innerHTML = DISC.map(d => '<button type="button" class="chip" data-d="' + d + '" aria-pressed="' + (form.d === d) + '">' + t('disc.' + d) + (d === 'other' ? '<small>(' + t('disc.otherHint') + ')</small>' : '') + '</button>').join('');
  $('save').textContent = t(form.editId ? 'log.saveEdit' : 'log.save');
  $('formTitle').textContent = t(form.editId ? 'log.edit' : 'log.add');
  $('cancel').hidden = !form.editId;
}
function resetForm(keepDate){
  form = {d: null, editId: null};
  if (!keepDate) $('f-date').value = todayStr();
  $('f-what').value = ''; $('f-mins').value = '';
  renderChips();
}

/* ---------- counts ---------- */
function renderCounts(){
  $('monthLabel').textContent = monthName(view.y, view.m);
  const month = list.filter(e => inMonth(e, view.y, view.m)), year = list.filter(e => inYear(e, view.y));
  const mins = arr => arr.reduce((s, e) => s + (e.mins || 0), 0);
  const tile = (key, label, cls) => {
    const ym = key ? year.filter(e => e.d === key) : year, mm = key ? month.filter(e => e.d === key) : month;
    const m = mins(mm);
    return '<div class="tile ' + (cls || '') + '"><div class="k">' + esc(label) + '</div><div class="n">' + ym.length + '</div><div class="y">' + t('log.thisYear', {y: view.y}) + '</div>'
      + '<div class="m">' + t('log.thisMonth', {n: mm.length}) + '</div>' + (m ? '<div class="y">' + t('log.minsMonth', {m}) + '</div>' : '') + '</div>';
  };
  $('tiles').innerHTML = tile(null, t('log.allDisc'), 'all') + DISC.map(d => tile(d, t('disc.' + d))).join('');
  // trainings per month (bars); tap a bar to jump to that month
  const counts = Array.from({length: 12}, (_, i) => year.filter(e => inMonth(e, view.y, i + 1)).length);
  const W = 600, H = 150, L = 26, R = 6, T = 16, B = 22, max = Math.max(4, ...counts);
  const top = Math.ceil(max / 4) * 4, bw = (W - L - R) / 12;
  const y = v => T + (top - v) * (H - T - B) / top;
  let s = '';
  for (const v of [0, top / 2, top]) s += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + v + '</text>';
  counts.forEach((c, i) => {
    const x = L + i * bw + 4, w = bw - 8, h = Math.max(c ? 3 : 0, (H - T - B) * c / top);
    const label = new Date(view.y, i, 1).toLocaleDateString(loc(), {month:'short'}).replace('.', '');
    s += '<g data-m="' + (i + 1) + '"><title>' + esc(monthName(view.y, i + 1) + ': ' + c) + '</title><rect x="' + (L + i * bw) + '" y="' + T + '" width="' + bw + '" height="' + (H - T - B) + '" fill="transparent" style="cursor:pointer"/>'
      + (c ? '<path class="bar' + (i + 1 === view.m ? ' sel' : '') + '" d="M' + x + ' ' + (y(0)) + 'V' + (y(0) - h + 4) + 'q0 -4 4 -4h' + (w - 8) + 'q4 0 4 4V' + y(0) + 'Z"/>' : '')
      + (c ? '<text class="val" x="' + (x + w / 2) + '" y="' + (y(0) - h - 4) + '" text-anchor="middle">' + c + '</text>' : '')
      + '<text class="ax" x="' + (x + w / 2) + '" y="' + (H - 6) + '" text-anchor="middle"' + (i + 1 === view.m ? ' style="font-weight:700;fill:var(--text)"' : '') + '>' + esc(label) + '</text></g>';
  });
  $('chart').innerHTML = '<h3>' + t('log.perMonth', {y: view.y}) + '</h3><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('log.perMonth', {y: view.y})) + '">' + s + '</svg>';
}

/* ---------- history (selected month) ---------- */
function renderHistory(){
  $('histTitle').textContent = t('log.history', {m: monthName(view.y, view.m)});
  const month = list.filter(e => inMonth(e, view.y, view.m)).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  if (!month.length){ $('hist').innerHTML = '<div class="empty">' + t('log.empty') + '</div>'; return; }
  const days = {}; for (const e of month) (days[e.date] ||= []).push(e);
  $('hist').innerHTML = Object.entries(days).map(([date, es]) => '<div class="day"><h3>' + esc(dayName(date)) + '</h3>' + es.map(e =>
    '<div class="entry"><span class="tag">' + t('disc.' + e.d) + '</span><div class="what">' + esc(e.what) + (e.mins ? '<small>' + t('log.min', {m: e.mins}) + '</small>' : '') + '</div>'
    + '<div class="ops"><button type="button" class="edit" data-id="' + e.id + '">' + t('log.editBtn') + '</button><button type="button" class="del" data-id="' + e.id + '">' + t('log.delete') + '</button></div></div>').join('') + '</div>').join('');
}

function render(){ renderChips(); renderCounts(); renderHistory(); $('prev').setAttribute('aria-label', t('log.prev')); $('next').setAttribute('aria-label', t('log.next')); }

/* ---------- events ---------- */
$('f-date').value = todayStr();
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; form.d = b.dataset.d; renderChips(); });
$('save').addEventListener('click', () => {
  const msg = $('msg'); msg.classList.remove('err');
  if (!form.d){ msg.textContent = t('log.needDisc'); msg.classList.add('err'); return; }
  const what = $('f-what').value.trim();
  if (!what){ msg.textContent = t('log.needWhat'); msg.classList.add('err'); return; }
  const date = $('f-date').value || todayStr();
  const minsRaw = parseInt($('f-mins').value, 10);
  const entry = {id: form.editId || Date.now(), date, d: form.d, what};
  if (minsRaw > 0 && minsRaw < 1000) entry.mins = minsRaw;
  if (form.editId) list = list.map(x => x.id === form.editId ? entry : x); else list.push(entry);
  store();
  const [y, m] = date.split('-').map(Number); view = {y, m};   // show the month you just logged
  resetForm(true);
  msg.textContent = t('log.saved'); setTimeout(() => { if (msg.textContent === t('log.saved')) msg.textContent = ''; }, 2500);
  renderCounts(); renderHistory();
});
$('cancel').addEventListener('click', () => { resetForm(false); $('msg').textContent = ''; });
$('hist').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = Number(b.dataset.id), entry = list.find(x => x.id === id); if (!entry) return;
  if (b.classList.contains('del')){
    if (!confirm(t('log.confirmDel'))) return;
    list = list.filter(x => x.id !== id); store(); if (form.editId === id) resetForm(false); renderCounts(); renderHistory();
  } else {
    form = {d: entry.d, editId: id};
    $('f-date').value = entry.date; $('f-what').value = entry.what; $('f-mins').value = entry.mins || '';
    renderChips(); $('formCard').scrollIntoView({behavior:'smooth', block:'center'}); $('f-what').focus({preventScroll:true});
  }
});
$('chart').addEventListener('click', e => { const g = e.target.closest('g[data-m]'); if (!g) return; view.m = Number(g.dataset.m); renderCounts(); renderHistory(); });
$('prev').addEventListener('click', () => { view.m--; if (view.m < 1){ view.m = 12; view.y--; } renderCounts(); renderHistory(); });
$('next').addEventListener('click', () => { view.m++; if (view.m > 12){ view.m = 1; view.y++; } renderCounts(); renderHistory(); });
$('exp').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({app:'ottusaeredmenyek.com', kind:'training-log', version:2, trainings:list}, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'training-log-' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
});
$('impBtn').addEventListener('click', () => $('imp').click());
$('imp').addEventListener('change', () => {
  const file = $('imp').files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const m = $('bmsg'); m.classList.remove('err');
    try {
      const data = JSON.parse(r.result); const arr = Array.isArray(data) ? data : data.trainings;
      if (!Array.isArray(arr)) throw 0;
      const clean = arr.filter(x => x && typeof x.id === 'number' && /^\d{4}-\d{2}-\d{2}$/.test(x.date) && DISC.includes(x.d) && typeof x.what === 'string')
        .map(x => { const e = {id:x.id, date:x.date, d:x.d, what:x.what.slice(0, 600)}; if (Number.isInteger(x.mins) && x.mins > 0 && x.mins < 1000) e.mins = x.mins; return e; });
      const have = new Set(list.map(e => e.id)), added = clean.filter(e => !have.has(e.id));
      list = list.concat(added); store();
      m.textContent = t('log.imported', {n: added.length}); renderCounts(); renderHistory();
    } catch(_){ m.textContent = t('log.badFile'); m.classList.add('err'); }
    $('imp').value = '';
  };
  r.readAsText(file);
});
SITE.onLang(render);
render();
</script>
</body>
</html>
